name: Export verified building-defect YOLO to ONNX
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/export_defect5.py'
      - '.github/workflows/export-defect5.yml'
jobs:
  export:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU export dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install 'ultralytics==8.4.190' 'onnx>=1.16,<2'
      - name: Export ONNX from pinned checkpoint
        run: |
          python scripts/export_defect5.py
          python - <<'PY'
          import onnx
          graph=onnx.load('weights/vivienda-defectos-5.onnx')
          assert len(graph.graph.output)==1
          print('Model export structurally valid; binary reproducibility is not guaranteed across runs')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: onnx-verified
          path: |
            weights/vivienda-defectos-5.onnx
            weights/vivienda-defectos-5.onnx.sha256
          retention-days: 1
  release:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onnx-verified
          path: weights
      - name: Publish integrity-verified ONNX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          export SHA="$(sha256sum weights/vivienda-defectos-5.onnx | cut -d' ' -f1)"
          if [ "$SHA" != "2931308c585294a4c2098bafaa08809d10de8b41cee9b09dbdc8d31fe2a77746" ]; then
            if gh release view v0.2-defect5-onnx >/dev/null 2>&1; then
              echo "::notice::The export hash changed (ONNX metadata can vary); keeping verified pinned production release unchanged."
              exit 0
            fi
            echo "::error::Export requires explicit review and new pin; refusing to publish unverified weights."
            exit 1
          fi
          if gh release view v0.2-defect5-onnx >/dev/null 2>&1; then
            echo "The pinned v0.2 model is already published and approved. No overwrite."
          else
            gh release create v0.2-defect5-onnx weights/vivienda-defectos-5.onnx weights/vivienda-defectos-5.onnx.sha256 --title "YOLO26n: five observable defects (ONNX)" --notes "Experimental IAAC MaAI model AGPL-3.0. Surface damage categories require human verification."
          fi
