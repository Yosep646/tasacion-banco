name: Export verified building-defect YOLO to ONNX
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/export_defect5.py'
      - '.github/workflows/export-defect5.yml'
jobs:
  export:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU export dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install 'ultralytics==8.4.190' 'onnx>=1.16,<2'
      - name: Export ONNX from pinned checkpoint
        run: |
          python scripts/export_defect5.py
          echo '849148feb9a15a5b1d02ae5477befe3248f35f9305bd1e188a9035000d69397a  weights/vivienda-defectos-5.onnx' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: onnx-verified
          path: |
            weights/vivienda-defectos-5.onnx
            weights/vivienda-defectos-5.onnx.sha256
          retention-days: 1
  release:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onnx-verified
          path: weights
      - name: Publish integrity-verified ONNX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo '849148feb9a15a5b1d02ae5477befe3248f35f9305bd1e188a9035000d69397a  weights/vivienda-defectos-5.onnx' | sha256sum -c -
          if gh release view v0.2-defect5-onnx >/dev/null 2>&1; then
            gh release upload v0.2-defect5-onnx weights/vivienda-defectos-5.onnx weights/vivienda-defectos-5.onnx.sha256 --clobber
          else
            gh release create v0.2-defect5-onnx weights/vivienda-defectos-5.onnx weights/vivienda-defectos-5.onnx.sha256 --title "YOLO26n: five observable defects (ONNX)" --notes "Experimental IAAC MaAI model AGPL-3.0. Surface damage categories require human verification. Not for autonomous structural assessments or credit approvals."
          fi
