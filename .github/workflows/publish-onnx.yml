name: Publish CPU YOLO crack model (ONNX)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-onnx.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install export tools (CPU)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install 'ultralytics>=8.3,<9' onnx 'onnxslim>=0.1.71'
      - name: Download checkpoint and verify SHA256
        run: python scripts/download_fisuras.py
      - name: Export segmentation model to ONNX
        run: |
          python - <<'PY'
          from ultralytics import YOLO
          from pathlib import Path
          model=YOLO('weights/vivienda-fisuras.pt')
          assert model.task == 'segment', model.task
          exported=Path(model.export(format='onnx',imgsz=640,opset=12,simplify=False,dynamic=False))
          assert exported.is_file()
          Path('weights/vivienda-fisuras.onnx').write_bytes(exported.read_bytes())
          print('ONNX export size:', exported.stat().st_size)
          PY
          sha256sum weights/vivienda-fisuras.onnx | sed 's#weights/##' > weights/vivienda-fisuras.onnx.sha256
      - name: Publish versioned ONNX files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1-crack-onnx >/dev/null 2>&1; then
            gh release upload v0.1-crack-onnx weights/vivienda-fisuras.onnx weights/vivienda-fisuras.onnx.sha256 --clobber
          else
            gh release create v0.1-crack-onnx weights/vivienda-fisuras.onnx weights/vivienda-fisuras.onnx.sha256 --title "YOLOv8 crack segmentation ONNX CPU (v0.1)" --notes "Checkpoint OpenSistemas/YOLOv8-crack-seg, AGPL-3.0. CPU inference. Experimental: crack detection only; not structural assessment. Includes SHA256."
          fi
