name: Train remaining nine housing classes
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs (CPU is slow; use a GPU runner for full training)"
        required: true
        default: "15"
        type: string
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU YOLO
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install "ultralytics>=8.4,<9" "pyyaml>=6,<7" "Pillow>=10,<13"
      - name: Retrieve private, authorized training data
        env:
          TRAINING_DATA_URL: ${{ secrets.TRAINING_DATA_URL }}
          TRAINING_DATA_SHA256: ${{ secrets.TRAINING_DATA_SHA256 }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request, zipfile
          from urllib.parse import urlparse
          url=os.environ.get("TRAINING_DATA_URL","")
          expected=os.environ.get("TRAINING_DATA_SHA256","").lower()
          if not url.startswith("https://") or len(expected)!=64:
              raise SystemExit("Missing private TRAINING_DATA_URL or TRAINING_DATA_SHA256 secrets. No training data supplied.")
          if any(x not in "0123456789abcdef" for x in expected):
              raise SystemExit("Invalid SHA256")
          archive=pathlib.Path("/tmp/housing-dataset.zip")
          digest=hashlib.sha256()
          size=0
          req=urllib.request.Request(url,headers={"User-Agent":"tasacion-training"})
          with urllib.request.urlopen(req,timeout=90) as source,archive.open("wb") as out:
              while chunk:=source.read(1024*1024):
                  size+=len(chunk)
                  if size>6*1024**3:raise SystemExit("Training archive exceeds 6 GB")
                  out.write(chunk);digest.update(chunk)
          if digest.hexdigest()!=expected:raise SystemExit("Dataset hash mismatch, no extraction")
          root=pathlib.Path(".").resolve()
          with zipfile.ZipFile(archive) as z:
              total=0
              for member in z.infolist():
                  dest=(root/member.filename).resolve()
                  if not dest.is_relative_to(root) or not member.filename.startswith("datasets/raw/"):
                      raise SystemExit("Unsafe or unexpected dataset path")
                  total+=member.file_size
                  if total>10*1024**3:raise SystemExit("Extracted data exceeds 10 GB")
                  if (member.external_attr>>16)&0o170000==0o120000:
                      raise SystemExit("Symlinks are forbidden")
              z.extractall(root)
          print("Private dataset checksum verified and unpacked; image labels remain untrusted until validated")
          PY
      - name: Validate license, class labels and train/test isolation
        run: python scripts/prepare_housing_dataset.py --registry datasets/sources.json --base . --output datasets/prepared --min-train-boxes 15
      - name: Run supervised training and holdout evaluation
        env:
          EPOCHS: ${{ inputs.epochs }}
        run: |
          python scripts/train_missing_categories.py --dataset datasets/prepared/data.yaml --epochs "$EPOCHS" --output runs/housing-n9
      - name: Preserve model metrics and candidate for manual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: housing-nine-training-evaluation
          path: |
            runs/housing-n9/evaluation_report.json
            runs/housing-n9/candidate_model.onnx
            runs/housing-n9/holdout-test
          if-no-files-found: warn
          retention-days: 7
