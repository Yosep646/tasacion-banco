name: ONNX CPU Real Inference
on:
  workflow_dispatch:
  push:
    paths:
      - 'yolo_onnx.py'
      - '.github/workflows/onnx-cpu.yml'
permissions:
  contents: read
jobs:
  onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx
      - name: Run CPU inference on photo and validate output
        run: |
          python - <<'PY'
          import os,tempfile
          from PIL import Image,ImageDraw
          from yolo_onnx import predict_cracks, ensure_model
          image=Image.new('RGB',(640,640),'#dbd8d1')
          drawing=ImageDraw.Draw(image)
          drawing.line([(65,15),(120,180),(370,330),(410,620)],fill='#363430',width=3)
          with tempfile.TemporaryDirectory() as work:
              path=os.path.join(work,'image.jpg')
              image.save(path)
              print('Model:', ensure_model())
              results, annotated=predict_cracks(path)
              assert isinstance(results,list)
              assert len(results) >= 1, 'The crack image must be detected by the exported model'
              assert annotated.size==(640,640)
              for r in results:
                  assert r['origin']=='yolo_onnx_fisuras'
                  assert 0<=r['confidence']<=1
              print('ONNX CPU real inference succeeded; candidate detections:',len(results))
          PY

      - name: Real YOLO through FastAPI, protected image and report
        run: python tests/smoke_real_yolo_api.py
