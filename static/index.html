/* Dashboard v2: high-contrast navigation, accessible forms, responsive layout */
:root{--navy:#0c1b35;--blue:#215ce5;--line:#e3eaf5;--muted:#63748c;--surface:#f4f7fc;--ink:#10203a;background:var(--surface);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}
body{background:radial-gradient(ellipse at 88% 0%,#eaf1ff 0,transparent 42%),#f4f7fc;min-height:100vh}
.shell{max-width:1540px;padding:28px clamp(18px,3vw,48px);margin:0 auto}
.top{padding:2px 0 26px;border-bottom:1px solid #dfe7f2}
.logo{height:54px;width:54px;display:grid;place-items:center;border-radius:17px;box-shadow:0 6px 16px #174cb52b;background:linear-gradient(145deg,#2764ed,#103aa8)}
.heading{font-size:26px;letter-spacing:-.9px;font-weight:790}
.top .muted{font-size:13px;margin-top:4px}
.card{border-radius:19px;border:1px solid var(--line);box-shadow:0 10px 32px #1e3c6e0a}
.layout{grid-template-columns:295px minmax(0,1fr);align-items:start;gap:24px;margin-top:26px}
.layout>main{min-width:0}
.side>.card{background:#10203b;color:#f3f7ff;padding:22px;position:sticky;top:20px;border-color:#10203b;box-shadow:0 15px 35px #13243f24}
.side .muted{color:#b0bed5}
.side .primary{background:#4282ff;padding:10px 15px}
.side .case{background:#172c4b;color:white;border:1px solid #284363;padding:14px;margin:7px 0;transition:background .15s,border-color .15s,transform .15s}
.side .case:hover{background:#213b62;transform:translateY(-1px)}
.side .case.active{background:#284a80;border-color:#71a0ff}
.side .case .muted{color:#a4b7d3}
.side input{background:#162c4d;border:1px solid #345071;color:white;width:100%;padding:12px;border-radius:11px;outline:none}
.side input::placeholder{color:#9cb0ce}
.side input:focus{border-color:#82a8ff;box-shadow:0 0 0 3px #4484fc29}
#workspace{padding:clamp(22px,3vw,42px);min-height:420px}
#workspace h2{letter-spacing:-.7px;margin-top:0}
.primary{background:var(--blue);box-shadow:0 5px 13px #235ddd24;transition:filter .15s,transform .15s}
.primary:hover{filter:brightness(1.09);transform:translateY(-1px)}
.secondary:hover{background:#ddeafd}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #88aaff;outline-offset:2px}
.field{gap:8px;margin-bottom:0}
.field label{font-size:13px;color:#233854;font-weight:700}
.field input,.field select,.field textarea{width:100%;min-height:47px;background:#fcfdff;padding:12px 14px;border-radius:12px;border:1px solid #cdd9eb;transition:border-color .15s,box-shadow .15s}
.field textarea{min-height:118px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#4082f5;box-shadow:0 0 0 3px #4784ec1a;outline:none;background:white}
.field small{color:#6e7e94;font-size:12px}
.form-eyebrow{text-transform:uppercase;letter-spacing:1.65px;color:#1d57cf;font-size:11px;font-weight:800}
.form-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.form-intro h2{font-size:29px;margin:8px 0 6px!important}
.form-intro p{margin:0;color:#60718a;max-width:620px;font-size:14px;line-height:1.6}
.form-steps{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0 29px;padding-bottom:19px;border-bottom:1px solid #e4ebf5}
.form-steps span{font-size:12px;border-radius:100px;border:1px solid #e4ebf5;padding:8px 11px;color:#728197;background:#fafcff}
.form-steps span:first-child{border-color:#b8d1ff;color:#1c54c6;background:#edf4ff;font-weight:700}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.section-index{width:28px;height:28px;border-radius:9px;background:#e7efff;color:#1851ca;display:grid;place-items:center;font-size:12px;font-weight:800}
.section-head h3{margin:0;font-size:16px;letter-spacing:-.3px}
.form-section{margin:24px 0 0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 22px}
.field-wide{grid-column:1/-1}
.req{color:#dc3b62}
.form-actions{border-top:1px solid #e5ecf6;margin-top:28px;padding-top:22px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.form-actions p{font-size:12px;color:#74849a;max-width:460px;margin:0;line-height:1.5}
.form-actions button{min-height:46px}
.side-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-count{font-size:11px;background:#273e62;color:#d6e5fb;padding:5px 10px;border-radius:99px}
.sidebar-label{color:#acbed9;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;margin:23px 0 10px}
.empty-side{padding:22px 11px;text-align:center;border:1px dashed #3a567c;border-radius:12px;color:#b8c9e1;font-size:13px;line-height:1.7}
.side-icon{font-size:22px;display:block;margin-bottom:5px}
.workspace-tag{background:#eef5ff;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;color:#2a5cc7}
#notice{font-weight:600;font-size:13px;padding:13px 4px}
@media(max-width:980px){.layout{grid-template-columns:1fr}.side>.card{position:static}.form-intro h2{font-size:25px}}
@media(max-width:610px){.shell{padding:15px}.top{align-items:flex-start}.logo{width:46px;height:46px}.heading{font-size:21px}#workspace{padding:20px}.form-grid,.grid{grid-template-columns:1fr}.field-wide{grid-column:auto}.form-intro h2{font-size:24px}.form-steps span{padding:7px 9px}.form-actions button{width:100%}.side>.card{padding:19px}}

/* Inspección visual de activos */
.inspection-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:22px 0}
.inspection-card{border:1px solid #dfe8f5;border-radius:18px;background:#fbfdff;padding:18px;display:flex;gap:12px;min-width:0}
.inspection-number{font-weight:800;color:#215ce5;background:#e6efff;border-radius:10px;padding:8px;height:max-content}
.inspection-body{flex:1;min-width:0}
.inspection-body h3{margin:5px 0 12px;font-size:16px}
.inspection-photo{width:100%;height:186px;object-fit:cover;border-radius:12px;border:1px solid #dce7f5;margin-bottom:12px}
.inspection-placeholder{height:155px;border:2px dashed #c6d5e8;background:#f3f7fe;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:26px;color:#607ca9;margin-bottom:12px}
.inspection-placeholder span{font-size:12px}
.inspection-upload{display:grid;gap:10px;margin:12px 0}
.inspection-upload label{font-size:12px}
.inspection-upload input{width:100%;max-width:100%}
.inspection-body button{margin-top:8px}
.visual-result,.credit-panel,.vision-warning{background:#eef4ff;border:1px solid #d7e6ff;border-radius:14px;padding:16px;margin:14px 0;font-size:13px;line-height:1.55}
.visual-result p{margin:10px 0}
.material-chip{display:inline-block;background:#fff;color:#2353ab;border:1px solid #cbdcf6;border-radius:20px;padding:4px 9px;margin:3px;font-size:12px}
.finding-line{padding:9px;border-left:3px solid #3e76e5;background:#fff}
.credit-panel{padding:24px;margin-top:25px}
.credit-panel .form-grid{margin:15px 0}
#creditResult{font-weight:750;line-height:1.6;color:#1749a8}
@media(max-width:850px){.inspection-grid{grid-template-columns:1fr}}

.single-upload{background:#f7faff;border:1px solid #dce7f8;border-radius:16px;padding:22px;margin:22px 0}
.single-upload h3{margin-top:0;font-size:17px}
.single-upload .form-grid{align-items:end}
.single-upload input[type=file]{min-height:47px;padding:11px;background:white;border:1px solid #ced9ea;border-radius:10px;max-width:100%}
.suggested-views{margin-top:17px;border-top:1px solid #e2eaf7;padding-top:13px}
.suggested-views>div{margin-top:6px}
.manual-observation{background:#fff;border:1px solid #d8e3f5;border-radius:12px;padding:11px;margin-top:13px}
.manual-observation summary{cursor:pointer;color:#1c4fb5;font-size:13px;font-weight:750}
.manual-observation-form{display:grid;gap:12px;padding-top:15px}
.manual-observation-form textarea{min-height:75px}
.inspection-photo{height:250px}
@media(max-width:600px){.single-upload{padding:15px}.inspection-photo{height:200px}}

.quick-hero{padding:14px 0 10px}
.quick-hero h2{font-size:clamp(25px,3.2vw,39px);margin:10px 0 8px!important;letter-spacing:-1.1px}
.quick-hero p{font-size:14px;color:#64748b;line-height:1.7;max-width:730px}
.quick-labels{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
.quick-labels span{color:#2a5cc8;background:#edf4ff;border:1px solid #d7e4fa;padding:8px 11px;border-radius:30px;font-size:12px;font-weight:700}
.quick-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.quick-drop{padding:24px;border:2px dashed #b9cff5;background:#f7faff;border-radius:18px;display:flex;align-items:center;text-align:center;gap:11px;min-height:245px;flex-direction:column;justify-content:center;cursor:pointer}
.quick-drop:hover{border-color:#2764ed;background:#eff5ff}
.quick-drop strong{font-size:17px}
.quick-drop small{color:#687b94;font-weight:400}
.quick-drop input{max-width:100%;font-size:12px;margin-top:6px}
.quick-emoji{font-size:34px}
.quick-actions{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
.quick-actions button,.quick-actions a{display:inline-flex;text-decoration:none;justify-content:center;align-items:center;min-height:47px}
.quick-actions small{max-width:420px}
.quick-verdict{margin:24px 0;background:#edf4ff;border:1px solid #cbdcfb;border-radius:17px;padding:22px}
.quick-verdict small{display:block;color:#5e7091}
.quick-verdict strong{display:block;font-size:22px;color:#1244b6;margin:8px 0}
.quick-verdict p{font-size:12px;color:#63728c}
.quick-pictures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:22px 0}
.quick-photo{border:1px solid #dce6f4;border-radius:14px;overflow:hidden}
.quick-photo img{width:100%;height:250px;object-fit:cover}
.quick-photo div{padding:12px}
.quick-photo p{color:#66758e;font-size:13px}
.quick-finding{padding:13px;border-left:3px solid #e38b4e;background:#fff9f4;margin:9px 0;border-radius:8px}
.quick-finding p{margin:8px 0;font-size:13px}
.quick-finding small{color:#7d5e4d}
.quick-quote{border:1px solid #dce4f0;border-radius:15px;background:#f9fbff;padding:20px;margin:20px 0}
.quick-quote strong{display:block;font-size:17px;color:#244eab}
.quick-quote p,.quick-limits p{font-size:13px;color:#66758a;line-height:1.6}
.quick-limits{border-top:1px solid #e0e8f4;padding:15px 0}
.quick-limits summary{font-weight:700;cursor:pointer}
#quickProgress{color:#2553ba;font-size:13px;margin-top:13px;font-weight:650}
@media(max-width:710px){.quick-form,.quick-pictures{grid-template-columns:1fr}.quick-drop{min-height:195px;padding:18px}}

/* Evaluación rápida V3: un flujo de carga y resultado legible */
#workspace:has(.quick-top),#workspace:has(.quick-result-title){padding:clamp(24px,3.2vw,46px)}
.quick-eyebrow{display:inline-flex;align-items:center;gap:9px;color:#2458cc;font-weight:800;letter-spacing:1.3px;font-size:11px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#28b888;box-shadow:0 0 0 4px #dff7ee}
.quick-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.quick-top h2,.quick-result-title h2{font-size:clamp(28px,3vw,39px);line-height:1.17;letter-spacing:-1.25px;max-width:680px;margin:16px 0 11px!important;color:#112444}
.quick-top p,.quick-result-title p{max-width:680px;color:#627590;font-size:14px;line-height:1.7;margin:0}
.quick-top-badge{flex-shrink:0;background:#eaf2ff;border:1px solid #d5e5fd;border-radius:16px;padding:16px 18px;text-align:center;min-width:118px}
.quick-top-badge span{display:block;font-weight:850;font-size:22px;color:#1950c9}.quick-top-badge small{font-size:11px;color:#6e82a3}
.quick-stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:28px 0 30px}
.quick-stepper .step{display:flex;gap:9px;align-items:center;padding:13px 14px;border:1px solid #e3eaf4;border-radius:12px;color:#8190a6;font-size:12px;font-weight:650;background:#fafbfe}
.quick-stepper .step b{font-size:12px;border:1px solid #dae3ef;border-radius:8px;display:grid;place-items:center;width:28px;height:28px;flex-shrink:0}
.quick-stepper .step.is-current{background:#eaf2ff;color:#184ebf;border-color:#c9ddff}
.quick-stepper .step.is-current b{background:#245fe0;border-color:#245fe0;color:white}
.quick-stepper .step.is-done{color:#186c50;background:#eaf8f1;border-color:#ccebdd}
.quick-main-grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(235px,1fr);gap:22px;align-items:start}
.quick-new-form{background:white;border:1px solid #e0e8f3;border-radius:18px;padding:24px;min-width:0}
.quick-section-heading{display:flex;align-items:start;gap:13px;justify-content:space-between;margin-bottom:20px}
.quick-section-heading h3{margin:0 0 7px;font-size:17px;letter-spacing:-.3px}
.quick-section-heading p{font-size:12px;color:#76879e;line-height:1.5;margin:0}
.quick-optional-tag{font-size:11px;white-space:nowrap;color:#355fa6;background:#edf4fe;border-radius:50px;padding:7px 10px;font-weight:750}
.quick-upload-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.quick-upload-card{border:2px dashed #bfd0e8;border-radius:15px;background:#f8faff;min-width:0;min-height:252px;padding:19px 14px;cursor:pointer;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;transition:border-color .15s,background .15s}
.quick-upload-card:hover,.quick-upload-card:focus-within{border-color:#3975eb;background:#edf4ff}
.quick-upload-card.has-photo{background:#f4f9ff;border-color:#5b95ed}
.quick-upload-card input{width:100%;font-size:11px;color:#5d708c;max-width:100%;border:0;padding:0;background:transparent;margin-top:5px}
.quick-upload-card input::file-selector-button{background:#e8f0fd;color:#2255bd;border:1px solid #cce0fa;border-radius:7px;padding:7px;margin-right:5px;cursor:pointer;font-size:11px}
.quick-upload-card .upload-symbol{font-size:29px;display:grid;place-items:center;width:51px;height:51px;background:#e8f1ff;color:#285de0;border-radius:15px;font-weight:400}
.quick-upload-card .upload-title{font-size:14px;color:#1e3150}
.quick-upload-card .upload-title em{display:block;color:#1d65ce;font-weight:700;font-style:normal;font-size:10px;margin-top:4px}
.quick-upload-card .upload-title em.tag-optional{color:#8592a7}
.quick-upload-card .upload-help{font-size:12px;font-weight:400;color:#7487a1}
.quick-upload-card .upload-preview{width:100%;height:134px;object-fit:cover;border-radius:10px}
.quick-upload-card .upload-preview[hidden]{display:none}
.quick-upload-card .upload-file-name{font-size:11px;color:#2854a6;font-weight:750;overflow-wrap:anywhere}
.upload-security{font-size:11px;color:#8290a3;line-height:1.5;margin:14px 0 0}
.quick-submit-area{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:21px}
.quick-action-btn{min-height:49px;display:inline-flex;gap:9px;align-items:center;justify-content:center;text-decoration:none;font-size:13px}
.quick-action-btn:disabled{opacity:.65;cursor:progress}
.quick-action-caption{font-size:11px;color:#7789a0;max-width:210px;line-height:1.6}
.quick-aside{display:grid;gap:14px}
.side-explainer{border:1px solid #e0e9f5;border-radius:17px;padding:23px;background:#f8fbff}
.quick-small-label{letter-spacing:1.35px;font-size:10px;font-weight:850;color:#5376b3}
.side-feature{display:flex;gap:12px;margin-top:23px;align-items:flex-start}
.side-feature b{font-size:13px;color:#213550}.side-feature p{font-size:12px;color:#71829a;margin:5px 0 0;line-height:1.5}
.feature-icon{width:37px;height:37px;background:#e6efff;color:#2559c6;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:20px}
.quick-scope{background:#fff9ee;border:1px solid #f6e4bf;border-radius:15px;padding:18px;color:#725521}
.quick-scope b{font-size:12px}.quick-scope p{font-size:12px;line-height:1.6;margin:8px 0 0}
.quick-progress{display:flex;align-items:center;gap:12px;background:#eef5ff;border:1px solid #cddfff;color:#1e56b0;border-radius:11px;padding:14px;margin-top:16px;font-size:12px;line-height:1.6}
.quick-progress[hidden]{display:none}.quick-progress.is-error{background:#fff1f1;border-color:#f3cece;color:#a13939}
.progress-spinner{display:block;width:20px;height:20px;flex-shrink:0;border:3px solid #bdd4fb;border-top-color:#1d62de;border-radius:50%;animation:quickspin .8s linear infinite}
@keyframes quickspin{to{transform:rotate(360deg)}}
.quick-result-title{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.quick-report-tag{border-radius:99px;background:#fff4e7;border:1px solid #f4dec0;color:#9b6925;padding:9px 13px;font-size:11px;font-weight:700}
.result-status-card{background:linear-gradient(120deg,#edf4ff,#f8fbff);border:1px solid #d1e1fb;border-radius:18px;padding:26px;display:flex;justify-content:space-between;gap:15px;align-items:center}
.result-status-card strong{display:block;margin:9px 0;font-size:21px;color:#1949ad;line-height:1.4}
.result-status-card p{margin:0;color:#6b7c94;font-size:12px}
.result-status-icon{color:#2864d1;font-size:42px;background:white;width:62px;height:62px;border-radius:16px;display:grid;place-items:center}
.result-section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 15px}
.result-section-head h3{margin:0;font-size:17px}.result-section-head span{font-size:11px;color:#7890aa}
.result-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

/* Visual refresh / responsive UX — upload controls are accessible but not duplicated. */
:root{--blue:#275ce6;--ink:#13243e;--muted:#697c98;--line:#e3eaf4}
body{background:linear-gradient(125deg,#f4f7fc 0%,#edf4ff 56%,#f8fafc 100%)}
.shell{max-width:1610px}
.top{background:transparent;padding-bottom:22px}
.top .brand .heading{font-size:24px}
#workspace:has(.quick-top){background:#fff;border:1px solid #e0e9f6;border-radius:24px;box-shadow:0 20px 55px rgba(20,49,91,.07);padding:26px}
.quick-top{position:relative;align-items:center;min-height:190px;overflow:hidden;border-radius:21px;padding:30px 34px;background:linear-gradient(111deg,#10284d 0%,#1944a1 62%,#2969df 100%);color:white}
.quick-top:after{content:"";position:absolute;right:-50px;top:-90px;width:340px;height:340px;border-radius:50%;border:42px solid rgba(255,255,255,.07);pointer-events:none}
.quick-top>div{position:relative;z-index:1}
.quick-top h2{color:#fff!important;font-weight:800;font-size:clamp(27px,2.7vw,39px);letter-spacing:-1.3px;max-width:720px;margin:14px 0 11px!important}
.quick-top p{color:#d7e5ff;font-size:13px;line-height:1.75;max-width:640px}
.quick-top .quick-eyebrow{color:#bad4ff;letter-spacing:1.6px}
.quick-top .live-dot{background:#56e0a3;box-shadow:0 0 0 4px rgba(83,225,170,.15)}
.quick-top-badge{min-width:145px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(5px);border-radius:18px;padding:20px 18px}
.quick-top-badge span{color:white;font-size:31px}
.quick-top-badge small{color:#e0ebff;font-size:12px}
.quick-stepper{margin:21px 0 24px}
.quick-stepper .step{border-radius:14px;background:#f7f9fd;border-color:#e4eaf3;padding:14px;font-size:12px;color:#8190a5}
.quick-stepper .step.is-current{background:#edf3ff;border-color:#cddfff;color:#184db3}
.quick-stepper .step.is-current b{background:#275de5}
.quick-main-grid{grid-template-columns:minmax(0,1.8fr) minmax(250px,.83fr);gap:20px}
.quick-new-form{border-radius:20px;background:#fff;padding:26px;border:1px solid #e2eaf5;box-shadow:0 12px 30px rgba(25,54,96,.04)}
.quick-section-heading h3{font-size:19px;letter-spacing:-.4px;color:#162b4b}
.quick-section-heading p{font-size:13px}
.quick-upload-grid{gap:14px}
.quick-upload-card{position:relative;padding:24px 14px;min-height:245px;border:1.5px dashed #b6cbee;border-radius:16px;background:#f7faff;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s;overflow:hidden}
.quick-upload-card:hover{background:#edf5ff;border-color:#457ae8;box-shadow:0 9px 22px #2858b217;transform:translateY(-1px)}
.quick-upload-card:focus-within{outline:3px solid #a4befd;outline-offset:3px}
.quick-upload-card input[type=file]{position:absolute!important;opacity:0!important;width:1px!important;height:1px!important;top:0;left:0;overflow:hidden;pointer-events:none;padding:0!important;margin:0!important;border:0!important}
.quick-upload-card .upload-symbol{width:58px;height:58px;font-size:31px;background:#e4eeff;border:1px solid #d7e5ff;border-radius:17px;color:#2863d7}
.quick-upload-card .upload-title{font-size:16px;color:#172d50;font-weight:800}

.quick-upload-card .upload-file-name{display:inline-block;max-width:100%;font-size:12px;padding:9px 12px;background:#fff;border:1px solid #d1def2;border-radius:10px;color:#1b4eb2;font-weight:800;margin-top:3px}
.quick-upload-card.has-photo{border-style:solid;border-color:#6c9df3;background:#f5f9ff;justify-content:flex-start}
.quick-upload-card.has-photo .upload-symbol{display:none}
.quick-upload-card .upload-preview{height:160px;border:1px solid #e0e9f6;box-shadow:0 4px 15px #0a224b16}
.quick-upload-card.has-photo .upload-preview{order:-1}
.quick-upload-card.has-photo .upload-help{display:none}
.upload-security{margin-top:17px;line-height:1.6}
.quick-submit-area{border-top:1px solid #edf1f7;padding-top:21px;align-items:center}
.quick-action-btn{min-height:52px!important;padding:13px 21px!important;font-size:13px!important;background:linear-gradient(110deg,#285ee4,#1d4fc6);border-radius:12px!important;box-shadow:0 10px 22px #2256ce26}

.quick-scope b{font-size:13px}
.quick-scope p{font-size:12px}
.side>.card{border-radius:21px!important}

.side #newCase:hover{background:#2a446a}
.side #quickStart{background:linear-gradient(110deg,#477dff,#2b68ef)}
#notice{max-width:900px}
#workspace:has(.quick-result-title) .result-status-card{border-radius:18px}
@media(min-width:1250px){.layout{grid-template-columns:278px minmax(0,1fr);gap:21px}.quick-top h2{font-size:34px}}
@media(max-width:1110px){.quick-main-grid{grid-template-columns:1fr}.quick-aside{grid-template-columns:1fr 1fr}.quick-top{padding:25px}}
@media(max-width:800px){#workspace:has(.quick-top){padding:16px}.quick-top{padding:25px 20px;min-height:160px}.quick-top-badge{display:none}.quick-aside{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.quick-upload-grid,.quick-aside{grid-template-columns:1fr}.quick-upload-card{min-height:202px}.quick-top h2{font-size:28px}.quick-stepper .step{font-size:10px;padding:9px 6px}.quick-stepper .step b{height:23px;width:23px}.quick-new-form{padding:18px}.quick-section-heading{flex-wrap:wrap}.quick-submit-area .quick-action-btn{width:100%}.quick-action-caption{max-width:100%}}
