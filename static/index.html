<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasación Visual | Panel</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#17253b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1320px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;gap:14px;align-items:center}.logo{background:#1345bd;color:white;padding:13px;border-radius:16px;font-weight:900}.muted{color:#6e7d90}.heading{font-size:27px;letter-spacing:-.8px;margin:0}.card{background:white;border:1px solid #e2e9f2;border-radius:19px;padding:24px;box-shadow:0 9px 28px #1a365208}.layout{display:grid;grid-template-columns:310px 1fr;gap:22px;margin-top:25px}.side{display:flex;flex-direction:column;gap:10px}.case{border:1px solid #e3eaf3;background:white;text-align:left;border-radius:12px;padding:14px;width:100%;color:#22314c}.case.active{border-color:#1d58de;background:#eff5ff}.primary{background:#1554df;color:white;border:0;border-radius:10px;padding:11px 17px;font-weight:650}.secondary{background:#edf2fa;color:#1b4299;border:0;border-radius:10px;padding:11px 17px}.danger{color:#a52b42}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field input,.field select,.field textarea{border:1px solid #ccd7e6;background:white;border-radius:10px;padding:11px;min-width:0}.field textarea{resize:vertical;min-height:74px}label{font-size:13px;font-weight:670}.metric{background:#f5f8ff;border-radius:14px;padding:16px}.metric strong{font-size:23px;display:block;color:#1644b2;margin:5px 0}.tabs{display:flex;flex-wrap:wrap;gap:7px;border-bottom:1px solid #e4eaf2;padding-bottom:14px;margin:24px 0}.tabs button{border:none;border-radius:10px;padding:10px 13px;background:transparent;color:#68768b}.tabs button.active{background:#eaf1ff;color:#1644b2;font-weight:750}.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.evidence{width:158px;border:1px solid #e2eaf3;border-radius:14px;overflow:hidden;background:white}.evidence img{width:100%;height:110px;object-fit:cover}.evidence small{display:block;padding:8px;overflow-wrap:anywhere}.finding{border:1px solid #e1e9f3;border-radius:13px;padding:15px;margin:10px 0}.pill{display:inline-block;border-radius:99px;background:#edf3ff;color:#1c4eb7;font-size:11px;padding:4px 9px}.auth{max-width:430px;margin:11vh auto;padding:30px}.empty{text-align:center;color:#76859c;padding:40px 12px}.hide{display:none!important}#notice{padding:10px;color:#1553a9;min-height:20px}a{color:#1554df}@media(max-width:850px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.shell{padding:14px}.top{align-items:flex-start}}

/* Dashboard v2: high-contrast navigation, accessible forms, responsive layout */
:root{--navy:#0c1b35;--blue:#215ce5;--line:#e3eaf5;--muted:#63748c;--surface:#f4f7fc;--ink:#10203a;background:var(--surface);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}
body{background:radial-gradient(ellipse at 88% 0%,#eaf1ff 0,transparent 42%),#f4f7fc;min-height:100vh}
.shell{max-width:1540px;padding:28px clamp(18px,3vw,48px);margin:0 auto}
.top{padding:2px 0 26px;border-bottom:1px solid #dfe7f2}
.logo{height:54px;width:54px;display:grid;place-items:center;border-radius:17px;box-shadow:0 6px 16px #174cb52b;background:linear-gradient(145deg,#2764ed,#103aa8)}
.heading{font-size:26px;letter-spacing:-.9px;font-weight:790}
.top .muted{font-size:13px;margin-top:4px}
.card{border-radius:19px;border:1px solid var(--line);box-shadow:0 10px 32px #1e3c6e0a}
.layout{grid-template-columns:295px minmax(0,1fr);align-items:start;gap:24px;margin-top:26px}
.layout>main{min-width:0}
.side>.card{background:#10203b;color:#f3f7ff;padding:22px;position:sticky;top:20px;border-color:#10203b;box-shadow:0 15px 35px #13243f24}
.side .muted{color:#b0bed5}
.side .primary{background:#4282ff;padding:10px 15px}
.side .case{background:#172c4b;color:white;border:1px solid #284363;padding:14px;margin:7px 0;transition:background .15s,border-color .15s,transform .15s}
.side .case:hover{background:#213b62;transform:translateY(-1px)}
.side .case.active{background:#284a80;border-color:#71a0ff}
.side .case .muted{color:#a4b7d3}
.side input{background:#162c4d;border:1px solid #345071;color:white;width:100%;padding:12px;border-radius:11px;outline:none}
.side input::placeholder{color:#9cb0ce}
.side input:focus{border-color:#82a8ff;box-shadow:0 0 0 3px #4484fc29}
#workspace{padding:clamp(22px,3vw,42px);min-height:420px}
#workspace h2{letter-spacing:-.7px;margin-top:0}
.primary{background:var(--blue);box-shadow:0 5px 13px #235ddd24;transition:filter .15s,transform .15s}
.primary:hover{filter:brightness(1.09);transform:translateY(-1px)}
.secondary:hover{background:#ddeafd}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #88aaff;outline-offset:2px}
.field{gap:8px;margin-bottom:0}
.field label{font-size:13px;color:#233854;font-weight:700}
.field input,.field select,.field textarea{width:100%;min-height:47px;background:#fcfdff;padding:12px 14px;border-radius:12px;border:1px solid #cdd9eb;transition:border-color .15s,box-shadow .15s}
.field textarea{min-height:118px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#4082f5;box-shadow:0 0 0 3px #4784ec1a;outline:none;background:white}
.field small{color:#6e7e94;font-size:12px}
.form-eyebrow{text-transform:uppercase;letter-spacing:1.65px;color:#1d57cf;font-size:11px;font-weight:800}
.form-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.form-intro h2{font-size:29px;margin:8px 0 6px!important}
.form-intro p{margin:0;color:#60718a;max-width:620px;font-size:14px;line-height:1.6}
.form-steps{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0 29px;padding-bottom:19px;border-bottom:1px solid #e4ebf5}
.form-steps span{font-size:12px;border-radius:100px;border:1px solid #e4ebf5;padding:8px 11px;color:#728197;background:#fafcff}
.form-steps span:first-child{border-color:#b8d1ff;color:#1c54c6;background:#edf4ff;font-weight:700}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.section-index{width:28px;height:28px;border-radius:9px;background:#e7efff;color:#1851ca;display:grid;place-items:center;font-size:12px;font-weight:800}
.section-head h3{margin:0;font-size:16px;letter-spacing:-.3px}
.form-section{margin:24px 0 0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 22px}
.field-wide{grid-column:1/-1}
.req{color:#dc3b62}
.form-actions{border-top:1px solid #e5ecf6;margin-top:28px;padding-top:22px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.form-actions p{font-size:12px;color:#74849a;max-width:460px;margin:0;line-height:1.5}
.form-actions button{min-height:46px}
.side-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-count{font-size:11px;background:#273e62;color:#d6e5fb;padding:5px 10px;border-radius:99px}
.sidebar-label{color:#acbed9;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;margin:23px 0 10px}
.empty-side{padding:22px 11px;text-align:center;border:1px dashed #3a567c;border-radius:12px;color:#b8c9e1;font-size:13px;line-height:1.7}
.side-icon{font-size:22px;display:block;margin-bottom:5px}
.workspace-tag{background:#eef5ff;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;color:#2a5cc7}
#notice{font-weight:600;font-size:13px;padding:13px 4px}
@media(max-width:980px){.layout{grid-template-columns:1fr}.side>.card{position:static}.form-intro h2{font-size:25px}}
@media(max-width:610px){.shell{padding:15px}.top{align-items:flex-start}.logo{width:46px;height:46px}.heading{font-size:21px}#workspace{padding:20px}.form-grid,.grid{grid-template-columns:1fr}.field-wide{grid-column:auto}.form-intro h2{font-size:24px}.form-steps span{padding:7px 9px}.form-actions button{width:100%}.side>.card{padding:19px}}

/* Inspección visual de activos */
.inspection-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:22px 0}
.inspection-card{border:1px solid #dfe8f5;border-radius:18px;background:#fbfdff;padding:18px;display:flex;gap:12px;min-width:0}
.inspection-number{font-weight:800;color:#215ce5;background:#e6efff;border-radius:10px;padding:8px;height:max-content}
.inspection-body{flex:1;min-width:0}
.inspection-body h3{margin:5px 0 12px;font-size:16px}
.inspection-photo{width:100%;height:186px;object-fit:cover;border-radius:12px;border:1px solid #dce7f5;margin-bottom:12px}
.inspection-placeholder{height:155px;border:2px dashed #c6d5e8;background:#f3f7fe;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:26px;color:#607ca9;margin-bottom:12px}
.inspection-placeholder span{font-size:12px}
.inspection-upload{display:grid;gap:10px;margin:12px 0}
.inspection-upload label{font-size:12px}
.inspection-upload input{width:100%;max-width:100%}
.inspection-body button{margin-top:8px}
.visual-result,.credit-panel,.vision-warning{background:#eef4ff;border:1px solid #d7e6ff;border-radius:14px;padding:16px;margin:14px 0;font-size:13px;line-height:1.55}
.visual-result p{margin:10px 0}
.material-chip{display:inline-block;background:#fff;color:#2353ab;border:1px solid #cbdcf6;border-radius:20px;padding:4px 9px;margin:3px;font-size:12px}
.finding-line{padding:9px;border-left:3px solid #3e76e5;background:#fff}
.credit-panel{padding:24px;margin-top:25px}
.credit-panel .form-grid{margin:15px 0}
#creditResult{font-weight:750;line-height:1.6;color:#1749a8}
@media(max-width:850px){.inspection-grid{grid-template-columns:1fr}}

.single-upload{background:#f7faff;border:1px solid #dce7f8;border-radius:16px;padding:22px;margin:22px 0}
.single-upload h3{margin-top:0;font-size:17px}
.single-upload .form-grid{align-items:end}
.single-upload input[type=file]{min-height:47px;padding:11px;background:white;border:1px solid #ced9ea;border-radius:10px;max-width:100%}
.suggested-views{margin-top:17px;border-top:1px solid #e2eaf7;padding-top:13px}
.suggested-views>div{margin-top:6px}
.manual-observation{background:#fff;border:1px solid #d8e3f5;border-radius:12px;padding:11px;margin-top:13px}
.manual-observation summary{cursor:pointer;color:#1c4fb5;font-size:13px;font-weight:750}
.manual-observation-form{display:grid;gap:12px;padding-top:15px}
.manual-observation-form textarea{min-height:75px}
.inspection-photo{height:250px}
@media(max-width:600px){.single-upload{padding:15px}.inspection-photo{height:200px}}
</style></head><body>
<div id="loginPanel" class="card auth hide"><div class="brand"><span class="logo">TV</span><div><h1 class="heading">Tasación Visual</h1><p class="muted">Ingreso seguro al sistema</p></div></div>
<form id="loginForm"><div class="field"><label>Usuario</label><input id="user" autocomplete="username" required placeholder="administrador"></div><div class="field"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">Ingresar</button></form><p id="loginError" class="danger"></p></div>
<div id="mainPanel" class="shell hide"><header class="top"><div class="brand"><span class="logo">TV</span><div><h1 class="heading">Tasación Visual</h1><div class="muted">Análisis de evidencias · Valoración referencial</div></div></div><div class="flex"><span id="who" class="pill"></span><button class="secondary" id="logout">Cerrar sesión</button></div></header>
<div class="layout"><aside class="side"><div class="card"><div class="side-title"><b>Mis expedientes</b><span class="side-count" id="caseCount">0 registrados</span></div><p class="muted" style="font-size:13px;line-height:1.6">Gestiona tus inspecciones y revisa cada tasación.</p><button class="primary" id="newCase" style="width:100%;margin:10px 0 3px">＋ Nuevo expediente</button><div class="sidebar-label">Buscar expediente</div><input id="caseSearch" type="search" placeholder="Buscar por nombre o activo…" aria-label="Buscar expedientes"><div class="sidebar-label">Expedientes recientes</div><div id="caseList"></div></div></aside><main><div class="card" id="workspace"><div class="empty">Crea o selecciona un expediente para empezar</div></div><div id="notice" role="status" aria-live="polite"></div></main></div></div>
<script>
const $=id=>document.getElementById(id);let selected=null,current=null,tab='general',userRole='',visionEnabled=false;
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
async function request(path,options={}){let r=await fetch(path,{credentials:'same-origin',...options});let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof x.detail==='string'?x.detail:'Error HTTP '+r.status);return x}
const json=(method,body)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
function note(text){$('notice').textContent=text}
function showLogin(){ $('mainPanel').classList.add('hide');$('loginPanel').classList.remove('hide')}
async function boot(){try{let me=await request('/api/me');userRole=me.role;$('who').textContent=me.username;$('loginPanel').classList.add('hide');$('mainPanel').classList.remove('hide');const health=await request('/health');visionEnabled=Boolean(health.vision_enabled);await refresh()}catch(e){showLogin()}}
$('loginForm').onsubmit=async ev=>{ev.preventDefault();try{await request('/api/login',json('POST',{username:$('user').value,password:$('pass').value}));$('pass').value='';await boot()}catch(e){$('loginError').textContent=e.message}};
$('logout').onclick=async()=>{await request('/api/logout',{method:'POST'});showLogin()};
async function refresh(){let cs=await request('/api/cases');window.allCases=cs;const counter=$('caseCount');if(counter)counter.textContent=cs.length+' registrados';drawCases();if(selected)await choose(selected,false);else if(cs.length===0)$('newCase').click()}
function drawCases(){const cs=window.allCases||[];const query=($('caseSearch')?.value||'').toLocaleLowerCase().trim();const filtered=cs.filter(c=>(c.title+' '+c.asset_type+' '+c.location).toLocaleLowerCase().includes(query));$('caseList').innerHTML=filtered.map(c=>'<button class="case '+(c.id===selected?'active':'')+'" data-id="'+c.id+'"><b>'+escapeHTML(c.title)+'</b><br><small class="muted">'+escapeHTML(c.asset_type)+' · '+escapeHTML(c.status)+'</small></button>').join('')||(query?'<div class="empty-side">No hay coincidencias.</div>':'<div class="empty-side"><span class="side-icon">▤</span>Sin expedientes todavía.<br>Crea el primero para comenzar.</div>');document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>choose(el.dataset.id))}
$('caseSearch').addEventListener('input',drawCases);
$('newCase').onclick=()=>{$('workspace').innerHTML="<div class=\"form-intro\"><div><span class=\"form-eyebrow\">Gestión de activos / Registro inicial</span><h2>Nuevo expediente</h2><p>Registra los datos principales del bien para empezar la evaluación visual y documentar sus evidencias.</p></div><span class=\"workspace-tag\">Paso 1 de 3</span></div><div class=\"form-steps\"><span>① Datos del activo</span><span>② Evidencias y hallazgos</span><span>③ Valoración e informe</span></div><form id=\"caseForm\"><section class=\"form-section\"><div class=\"section-head\"><span class=\"section-index\">01</span><h3>Información del activo</h3></div><div class=\"form-grid\"><div class=\"field\"><label for=\"asset_type\">Tipo de activo <span class=\"req\">*</span></label><select id=\"asset_type\" name=\"asset_type\" required><option value=\"vivienda\">🏠 Vivienda</option><option value=\"mototaxi\">🛺 Mototaxi</option><option value=\"vehiculo\">🚙 Vehículo</option><option value=\"maquinaria\">⚙️ Maquinaria</option><option value=\"terreno\">🌿 Terreno</option></select><small>Selecciona el tipo de bien a evaluar.</small></div><div class=\"field\"><label for=\"title\">Nombre del expediente <span class=\"req\">*</span></label><input id=\"title\" name=\"title\" minlength=\"2\" maxlength=\"140\" required placeholder=\"Ej. Casa familiar - Huánuco\"><small>Un nombre corto para identificar la inspección.</small></div></div></section><section class=\"form-section\"><div class=\"section-head\"><span class=\"section-index\">02</span><h3>Información complementaria</h3></div><div class=\"form-grid\"><div class=\"field\"><label for=\"owner_name\">Propietario o responsable</label><input id=\"owner_name\" name=\"owner_name\" maxlength=\"140\" autocomplete=\"off\" placeholder=\"Nombre del responsable\"></div><div class=\"field\"><label for=\"location\">Ubicación del bien</label><input id=\"location\" name=\"location\" maxlength=\"240\" placeholder=\"Distrito, provincia, departamento\"></div><div class=\"field field-wide\"><label for=\"details\">Observaciones iniciales</label><textarea id=\"details\" name=\"details\" maxlength=\"2000\" placeholder=\"Describe el estado general, el objetivo de la tasación o información relevante…\"></textarea><small>Podrás añadir fotografías y detallar los hallazgos después de crear el expediente.</small></div></div></section><div class=\"form-actions\"><p>Los campos con * son obligatorios. Esta valoración es referencial y requiere revisión humana.</p><div class=\"flex\"><button type=\"reset\" class=\"secondary\">Limpiar</button><button class=\"primary\" type=\"submit\">Crear expediente →</button></div></div></form>";document.querySelectorAll('.case').forEach(el=>el.classList.remove('active'));$('caseForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Creando expediente…';try{let data=Object.fromEntries(new FormData(e.target));let c=await request('/api/cases',json('POST',data));selected=c.id;tab='inspeccion';await refresh();note('Expediente creado. Captura las fotografías guiadas para la inspección visual.')}catch(ex){note(ex.message);btn.disabled=false;btn.textContent='Crear expediente →'}}};
async function choose(id,draw=true){selected=id;current=await request('/api/cases/'+id);document.querySelectorAll('.case').forEach(el=>el.classList.toggle('active',el.dataset.id===id));render()}
function render(){let c=current;if(!c)return;let tabs=['general','inspeccion','evidencias','hallazgos','valoracion','informes'];$('workspace').innerHTML='<div class="flex" style="justify-content:space-between"><div><h2>'+escapeHTML(c.title)+'</h2><p class="muted">'+escapeHTML(c.asset_type)+' · '+escapeHTML(c.location)+'</p></div><span class="pill">'+escapeHTML(c.status)+'</span></div><div class="grid"><div class="metric"><small>Valor base documentado</small><strong>'+money(c.base_value)+'</strong></div><div class="metric"><small>Estimación referencial</small><strong>'+money(c.estimated_value)+'</strong><small>'+escapeHTML(c.valuation_status)+'</small></div></div><nav class="tabs">'+tabs.map(t=>'<button data-tab="'+t+'" class="'+(t===tab?'active':'')+'">'+({general:'Resumen',inspeccion:'Inspección visual IA',evidencias:'Evidencias',hallazgos:'Hallazgos',valoracion:'Valoración',informes:'Informes'}[t])+'</button>').join('')+'</nav><div id="tabContent"></div>';document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render()});const h=$('tabContent');if(tab==='general')h.innerHTML='<h3>Información del expediente</h3><p><b>Propietario:</b> '+escapeHTML(c.owner_name||'No registrado')+'</p><p><b>Observaciones:</b> '+escapeHTML(c.details||'Sin observaciones')+'</p><p><b>Hallazgos pendientes:</b> '+c.unreviewed+'</p><p class="muted">La inspección y los importes requieren validación humana. Ninguna detección automática aprueba créditos.</p>';
if(tab==='evidencias'){h.innerHTML='<h3>Capturar evidencia</h3><form id="uploadForm"><div class="grid"><div class="field"><label>Toma</label><select name="shot"><option>Frente</option><option>Interior</option><option>Detalles</option><option>General</option><option>Posterior</option></select></div><div class="field"><label>Fotografía (máx. 8 MB)</label><input name="file" type="file" accept="image/jpeg,image/png,image/webp" required></div></div><button class="primary">Subir fotografía</button></form><div class="flex" style="margin-top:20px">'+c.evidence.map(x=>'<div class="evidence"><img alt="Evidencia" src="/api/evidence/'+x.id+'"><small>'+escapeHTML(x.original_name)+'<br>'+escapeHTML(x.shot)+'</small><button class="secondary" data-analyze="'+x.id+'" style="width:100%">Analizar YOLO</button></div>').join('')+'</div>';$('uploadForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let r=await fetch('/api/cases/'+c.id+'/evidence',{method:'POST',body:f});if(!r.ok)throw Error((await r.json()).detail);await choose(c.id);note('Fotografía registrada')}catch(ex){note(ex.message)}};document.querySelectorAll('[data-analyze]').forEach(el=>el.onclick=async()=>{try{let r=await request('/api/cases/'+c.id+'/analyze/'+el.dataset.analyze,{method:'POST'});tab='hallazgos';await choose(c.id);note(r.detections+' detecciones pendientes de revisión')}catch(ex){note(ex.message)}})}

if(tab==='inspeccion'){
 const ins=c.visual_condition||{},shots=ins.required_shots||['Fachada','Paredes','Techo','Interior'];
 const items=c.visual_assessments||[],evidence=c.evidence||[];
 const status=visionEnabled?'<span class="pill">IA multimodal configurada</span>':'<span class="pill">Revisión visual manual disponible</span>';
 const conditionLabels={aparentemente_bueno:'Aparentemente conservado',requiere_mejoras:'Mejoras visibles',no_determinable:'No determinable'};
 const photos=evidence.map((image,i)=>{
   const assessment=items.find(a=>a.evidence_id===image.id);
   let observations='';
   if(assessment){
     let v={};try{v=JSON.parse(assessment.result_json)}catch(err){}
     observations='<div class="visual-result"><div class="flex"><strong>'+escapeHTML(conditionLabels[v.condition]||'Sin conclusión')+'</strong><span class="pill">'+escapeHTML(assessment.state)+'</span></div>'+
       '<small class="muted">'+(v.method==='manual_review'?'Observación del revisor':'Propuesta de IA pendiente de revisión')+'</small>'+
       '<p>'+escapeHTML(v.summary||'Sin resumen')+'</p>'+
       (v.materials||[]).map(x=>'<span class="material-chip">'+escapeHTML(x.name)+'</span>').join('')+
       (v.issues||[]).map(x=>'<p class="finding-line"><b>'+escapeHTML(x.category)+'</b> · '+escapeHTML(x.severity)+' — '+escapeHTML(x.description)+'<br><small>Mejora: '+escapeHTML(x.improvement)+'</small></p>').join('')+
       (v.limitations||[]).map(x=>'<p class="muted">Límite: '+escapeHTML(x)+'</p>').join('')+
       ((userRole!=='operador'&&assessment.state==='pendiente')?'<div class="flex"><button class="secondary" data-review-vision="'+assessment.id+'" data-decision="confirmado">Confirmar observaciones</button><button class="secondary" data-review-vision="'+assessment.id+'" data-decision="descartado">Descartar</button></div>':'')+'</div>';
   }
   const manualForm=userRole==='operador'?'':'<details class="manual-observation"><summary>Registrar inspección visual manual</summary>'+
   '<form class="manual-observation-form" data-evidence="'+image.id+'"><div class="field"><label>Condición visual observada</label><select name="condition"><option value="no_determinable">No determinable</option><option value="aparentemente_bueno">Aparentemente conservada</option><option value="requiere_mejoras">Requiere mejoras visibles</option></select></div>'+
   '<div class="field"><label>Material observado (opcional)</label><input name="material" maxlength="100" placeholder="Ej. ladrillo, calamina, concreto"></div>'+
   '<div class="field"><label>Problema visible (opcional)</label><select name="category"><option value="">Ninguno identificado en esta foto</option><option value="Fisura visible">Fisura visible</option><option value="Pared sin tarrajear">Pared sin tarrajear</option><option value="Humedad visible">Humedad visible</option><option value="Corrosión superficial">Corrosión superficial</option><option value="Desgaste visible">Desgaste visible</option><option value="Abolladura visible">Abolladura visible</option><option value="Otro daño visible">Otro daño visible</option></select></div>'+
   '<div class="field"><label>Severidad visual preliminar</label><select name="severity"><option value="leve">Leve</option><option value="moderada">Moderada</option><option value="severa">Severa</option></select></div>'+
   '<div class="field"><label>Descripción (opcional)</label><textarea name="description" maxlength="500" placeholder="Describe lo que puedes comprobar visualmente"></textarea></div>'+
   '<div class="field"><label>Mejora recomendada (opcional)</label><input name="improvement" maxlength="300" placeholder="Ej. solicitar presupuesto de reparación"></div>'+
   '<div class="field"><label>Observaciones del revisor</label><textarea name="notes" maxlength="350" placeholder="Qué se ve y qué no puede comprobarse"></textarea></div>'+
   '<button class="primary" type="submit">Guardar evaluación manual</button></form></details>';
   return '<article class="inspection-card"><div class="inspection-number">'+String(i+1).padStart(2,'0')+'</div>'+
   '<div class="inspection-body"><div class="flex" style="justify-content:space-between"><h3>'+escapeHTML(image.shot)+'</h3><span class="pill">Foto '+(i+1)+'</span></div>'+
   '<img class="inspection-photo" src="/api/evidence/'+image.id+'" alt="Fotografía adjunta de '+escapeHTML(image.shot)+'">'+
   (visionEnabled?'<button class="primary" data-vision="'+image.id+'">Analizar fotografía con IA</button>':'')+
   manualForm+observations+'</div></article>';
 }).join('');
 const optional=shots.map(x=>'<span class="material-chip">'+escapeHTML(x)+'</span>').join('');
 h.innerHTML='<div class="form-intro"><div><span class="form-eyebrow">Microcrédito / Inspección fotográfica</span><h2>Evaluación visual del activo</h2><p>Comienza con una sola fotografía. Las demás vistas son recomendadas para ampliar la inspección, no son obligatorias para registrar observaciones.</p></div>'+status+'</div>'+
 '<div class="grid" style="margin:24px 0"><div class="metric"><small>Fotografías registradas</small><strong>'+evidence.length+'</strong><small>'+ins.coverage+'% de vistas sugeridas</small></div><div class="metric"><small>Puntaje visual</small><strong>'+(ins.condition_score===null?'Por evaluar':ins.condition_score+'/100')+'</strong><small>'+(ins.score_status==='provisional_parcial'?'Provisional — cobertura parcial':ins.score_status==='referencial_revisado'?'Referencial revisado':'Falta revisión')+'</small></div></div>'+
 (!visionEnabled?'<div class="vision-warning"><b>IA automática aún sin conexión.</b> Render no dispone de OPENAI_API_KEY. Puedes guardar una inspección <b>manual, identificada como tal</b>. Para detectar materiales o daños automáticamente se necesita conectar un proveedor de visión; no se inventan resultados.</div>':'<div class="vision-warning">Si utilizas el análisis automático, las fotografías se enviarán al proveedor externo configurado. Asegúrate de contar con autorización para procesarlas.</div>')+
 '<section class="single-upload"><h3>Adjuntar fotografía para evaluar</h3><p class="muted">Una foto es suficiente para comenzar. Elige la vista que representa; puedes agregar otras después.</p><form id="singleInspectionUpload" class="form-grid"><div class="field"><label>Vista de la fotografía</label><select name="shot">'+shots.map(x=>'<option value="'+escapeHTML(x)+'">'+escapeHTML(x)+'</option>').join('')+'<option value="General">Otra vista / General</option></select></div><div class="field"><label>Imagen (JPG, PNG o WebP, máximo 8 MB)</label><input name="file" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required></div><div class="field field-wide"><button type="submit" class="primary">Guardar fotografía</button></div></form><div class="suggested-views"><small class="muted">Vistas recomendadas para una evaluación más completa:</small><div>'+optional+'</div></div></section>'+
 '<h3 style="margin-top:27px">Fotografías del expediente</h3>'+
 (photos?'<div class="inspection-grid">'+photos+'</div>':'<div class="inspection-placeholder">📷<span>Adjunta una fotografía para iniciar la evaluación</span></div>')+
 '<div class="credit-panel"><h3>Simulación de microcrédito para mejoras</h3><p class="muted">Puede mostrarse una evaluación visual provisional desde una sola foto revisada. Para simular un crédito se requieren las cuatro vistas recomendadas, valor base y presupuesto sustentados; nunca es aprobación bancaria.</p>'+
 (userRole==='operador'?'<p class="muted">La simulación corresponde al revisor.</p>':'<form id="creditForm" class="form-grid"><div class="field"><label>Presupuesto documentado (S/)</label><input name="documented_budget" type="number" min="1" step=".01" required></div><div class="field"><label>Fuente del presupuesto</label><input name="budget_source" minlength="5" required></div><div class="field field-wide"><button class="primary" type="submit">Simular monto referencial</button></div></form><div id="creditResult" role="status"></div>')+'</div>';
 const upload=$('singleInspectionUpload');
 upload.onsubmit=async ev=>{
   ev.preventDefault();const btn=upload.querySelector('button');btn.disabled=true;btn.textContent='Subiendo...';
   try{const r=await fetch('/api/cases/'+c.id+'/evidence',{method:'POST',body:new FormData(upload),credentials:'same-origin'});
       const data=await r.json();if(!r.ok)throw Error(data.detail||'No se pudo subir la imagen');
       await choose(c.id);note('Fotografía guardada. Puedes evaluarla sin subir las otras tres vistas.');
   }catch(ex){note(ex.message);btn.disabled=false;btn.textContent='Guardar fotografía'}
 };
 document.querySelectorAll('[data-vision]').forEach(btn=>btn.onclick=async()=>{
   btn.disabled=true;btn.textContent='Analizando...';
   try{await request('/api/cases/'+c.id+'/vision/'+btn.dataset.vision,{method:'POST'});
       await choose(c.id);note('Propuesta automática recibida, pendiente de revisión');
   }catch(ex){note(ex.message);btn.disabled=false;btn.textContent='Analizar fotografía con IA'}
 });
 document.querySelectorAll('.manual-observation-form').forEach(form=>form.onsubmit=async ev=>{
   ev.preventDefault();const btn=form.querySelector('button');btn.disabled=true;
   try{const data=Object.fromEntries(new FormData(form));
     await request('/api/cases/'+c.id+'/manual-inspection/'+form.dataset.evidence,json('POST',data));
     await choose(c.id);note('Observación manual guardada. Puntaje provisional actualizado si la condición fue determinable.');
   }catch(ex){note(ex.message);btn.disabled=false}
 });
 document.querySelectorAll('[data-review-vision]').forEach(btn=>btn.onclick=async()=>{
   btn.disabled=true;
   try{await request('/api/visual-assessments/'+btn.dataset.reviewVision+'/review',json('PUT',{state:btn.dataset.decision}));
       await choose(c.id);note('Revisión registrada');
   }catch(ex){note(ex.message);btn.disabled=false}
 });
 const credit=$('creditForm');if(credit)credit.onsubmit=async ev=>{
   ev.preventDefault();const data=Object.fromEntries(new FormData(credit));data.documented_budget=Number(data.documented_budget);
   try{const r=await request('/api/cases/'+c.id+'/credit-simulation',json('POST',data));
     $('creditResult').textContent=r.suggested_amount===null?'Pendiente: '+r.reason:'Monto orientativo: '+money(r.suggested_amount)+'. '+r.reason;
   }catch(ex){note(ex.message)}
 };
}

if(tab==='hallazgos'){h.innerHTML='<h3>Hallazgos y revisión</h3><form id="findingForm"><div class="grid"><div class="field"><label>Daño o material observado</label><input name="category" required placeholder="Ej. fisura visible"></div><div class="field"><label>Severidad preliminar</label><select name="severity"><option value="leve">Leve</option><option value="moderada">Moderada</option><option value="severa">Severa</option></select></div></div><div class="field"><label>Descripción</label><textarea name="description"></textarea></div><button class="primary">Añadir hallazgo manual</button></form><div id="findingList">'+c.findings.map(x=>'<div class="finding"><div class="flex"><b>'+escapeHTML(x.category)+'</b><span class="pill">'+escapeHTML(x.state)+'</span><small class="muted">'+escapeHTML(x.origin)+' · '+escapeHTML(x.severity)+'</small></div><p>'+escapeHTML(x.description)+'</p>'+(userRole==='operador'?'<p class="muted">Revisión reservada al revisor</p>':'<form class="reviewForm" data-fid="'+x.id+'"><div class="grid"><div class="field"><label>Decisión</label><select name="state"><option value="pendiente" '+(x.state==='pendiente'?'selected':'')+'>Pendiente</option><option value="confirmado" '+(x.state==='confirmado'?'selected':'')+'>Confirmado</option><option value="descartado" '+(x.state==='descartado'?'selected':'')+'>Descartado</option></select></div><div class="field"><label>Descuento sustentado (S/)</label><input name="adjustment" type="number" min="0" step="0.01" value="'+x.adjustment+'"></div></div><div class="field"><label>Justificación</label><input name="justification" value="'+escapeHTML(x.justification)+'"></div><button class="secondary">Guardar revisión</button></form>')+'</div>').join('')+'</div>';$('findingForm').onsubmit=async e=>{e.preventDefault();try{await request('/api/cases/'+c.id+'/findings',json('POST',Object.fromEntries(new FormData(e.target))));await choose(c.id);note('Hallazgo añadido')}catch(ex){note(ex.message)}};document.querySelectorAll('.reviewForm').forEach(el=>el.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(el));d.adjustment=Number(d.adjustment);try{await request('/api/findings/'+el.dataset.fid+'/review',json('PUT',d));await choose(c.id);note('Revisión guardada')}catch(ex){note(ex.message)}})}
if(tab==='valoracion'){h.innerHTML='<h3>Valoración documentada</h3><p class="muted">Solo el revisor puede establecer el valor base y confirmar los descuentos. Los importes son referenciales.</p><form id="baseForm"><div class="field"><label>Valor base en soles</label><input name="base_value" type="number" min="0" step="0.01" value="'+c.base_value+'" required></div><div class="field"><label>Fuente de mercado, comparable o presupuesto</label><textarea name="source" required>'+escapeHTML(c.source)+'</textarea></div><button class="primary" '+(userRole==='operador'?'disabled':'')+'>Guardar valor base</button></form>';$('baseForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.base_value=Number(d.base_value);try{await request('/api/cases/'+c.id+'/base',json('PUT',d));await choose(c.id);note('Valor base actualizado')}catch(ex){note(ex.message)}}}
if(tab==='informes'){h.innerHTML='<h3>Exportación y trazabilidad</h3><p>Estado: <b>'+escapeHTML(c.valuation_status)+'</b> · '+c.unreviewed+' hallazgos sin revisar.</p><div class="flex"><a class="primary" href="/api/cases/'+c.id+'/report.pdf">Descargar PDF</a><a class="secondary" href="/api/cases/'+c.id+'/report.json">Descargar JSON</a></div><p class="muted">El informe es orientativo y no sustituye una tasación profesional.</p>'}}
boot();
</script></body></html>
