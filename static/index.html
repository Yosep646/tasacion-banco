/* Dashboard v2: high-contrast navigation, accessible forms, responsive layout */
:root{--navy:#0c1b35;--blue:#215ce5;--line:#e3eaf5;--muted:#63748c;--surface:#f4f7fc;--ink:#10203a;background:var(--surface);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}
body{background:radial-gradient(ellipse at 88% 0%,#eaf1ff 0,transparent 42%),#f4f7fc;min-height:100vh}
.shell{max-width:1540px;padding:28px clamp(18px,3vw,48px);margin:0 auto}
.top{padding:2px 0 26px;border-bottom:1px solid #dfe7f2}
.logo{height:54px;width:54px;display:grid;place-items:center;border-radius:17px;box-shadow:0 6px 16px #174cb52b;background:linear-gradient(145deg,#2764ed,#103aa8)}
.heading{font-size:26px;letter-spacing:-.9px;font-weight:790}
.top .muted{font-size:13px;margin-top:4px}
.card{border-radius:19px;border:1px solid var(--line);box-shadow:0 10px 32px #1e3c6e0a}
.layout{grid-template-columns:295px minmax(0,1fr);align-items:start;gap:24px;margin-top:26px}
.layout>main{min-width:0}
.side>.card{background:#10203b;color:#f3f7ff;padding:22px;position:sticky;top:20px;border-color:#10203b;box-shadow:0 15px 35px #13243f24}
.side .muted{color:#b0bed5}
.side .primary{background:#4282ff;padding:10px 15px}
.side .case{background:#172c4b;color:white;border:1px solid #284363;padding:14px;margin:7px 0;transition:background .15s,border-color .15s,transform .15s}
.side .case:hover{background:#213b62;transform:translateY(-1px)}
.side .case.active{background:#284a80;border-color:#71a0ff}
.side .case .muted{color:#a4b7d3}
.side input{background:#162c4d;border:1px solid #345071;color:white;width:100%;padding:12px;border-radius:11px;outline:none}
.side input::placeholder{color:#9cb0ce}
.side input:focus{border-color:#82a8ff;box-shadow:0 0 0 3px #4484fc29}
#workspace{padding:clamp(22px,3vw,42px);min-height:420px}
#workspace h2{letter-spacing:-.7px;margin-top:0}
.primary{background:var(--blue);box-shadow:0 5px 13px #235ddd24;transition:filter .15s,transform .15s}
.primary:hover{filter:brightness(1.09);transform:translateY(-1px)}
.secondary:hover{background:#ddeafd}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #88aaff;outline-offset:2px}
.field{gap:8px;margin-bottom:0}
.field label{font-size:13px;color:#233854;font-weight:700}
.field input,.field select,.field textarea{width:100%;min-height:47px;background:#fcfdff;padding:12px 14px;border-radius:12px;border:1px solid #cdd9eb;transition:border-color .15s,box-shadow .15s}
.field textarea{min-height:118px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#4082f5;box-shadow:0 0 0 3px #4784ec1a;outline:none;background:white}
.field small{color:#6e7e94;font-size:12px}
.form-eyebrow{text-transform:uppercase;letter-spacing:1.65px;color:#1d57cf;font-size:11px;font-weight:800}
.form-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.form-intro h2{font-size:29px;margin:8px 0 6px!important}
.form-intro p{margin:0;color:#60718a;max-width:620px;font-size:14px;line-height:1.6}
.form-steps{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0 29px;padding-bottom:19px;border-bottom:1px solid #e4ebf5}
.form-steps span{font-size:12px;border-radius:100px;border:1px solid #e4ebf5;padding:8px 11px;color:#728197;background:#fafcff}
.form-steps span:first-child{border-color:#b8d1ff;color:#1c54c6;background:#edf4ff;font-weight:700}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.section-index{width:28px;height:28px;border-radius:9px;background:#e7efff;color:#1851ca;display:grid;place-items:center;font-size:12px;font-weight:800}
.section-head h3{margin:0;font-size:16px;letter-spacing:-.3px}
.form-section{margin:24px 0 0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 22px}
.field-wide{grid-column:1/-1}
.req{color:#dc3b62}
.form-actions{border-top:1px solid #e5ecf6;margin-top:28px;padding-top:22px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.form-actions p{font-size:12px;color:#74849a;max-width:460px;margin:0;line-height:1.5}
.form-actions button{min-height:46px}
.side-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-count{font-size:11px;background:#273e62;color:#d6e5fb;padding:5px 10px;border-radius:99px}
.sidebar-label{color:#acbed9;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;margin:23px 0 10px}
.empty-side{padding:22px 11px;text-align:center;border:1px dashed #3a567c;border-radius:12px;color:#b8c9e1;font-size:13px;line-height:1.7}
.side-icon{font-size:22px;display:block;margin-bottom:5px}
.workspace-tag{background:#eef5ff;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;color:#2a5cc7}
#notice{font-weight:600;font-size:13px;padding:13px 4px}
@media(max-width:980px){.layout{grid-template-columns:1fr}.side>.card{position:static}.form-intro h2{font-size:25px}}
@media(max-width:610px){.shell{padding:15px}.top{align-items:flex-start}.logo{width:46px;height:46px}.heading{font-size:21px}#workspace{padding:20px}.form-grid,.grid{grid-template-columns:1fr}.field-wide{grid-column:auto}.form-intro h2{font-size:24px}.form-steps span{padding:7px 9px}.form-actions button{width:100%}.side>.card{padding:19px}}

/* Inspección visual de activos */
.inspection-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:22px 0}
.inspection-card{border:1px solid #dfe8f5;border-radius:18px;background:#fbfdff;padding:18px;display:flex;gap:12px;min-width:0}
.inspection-number{font-weight:800;color:#215ce5;background:#e6efff;border-radius:10px;padding:8px;height:max-content}
.inspection-body{flex:1;min-width:0}
.inspection-body h3{margin:5px 0 12px;font-size:16px}
.inspection-photo{width:100%;height:186px;object-fit:cover;border-radius:12px;border:1px solid #dce7f5;margin-bottom:12px}
.inspection-placeholder{height:155px;border:2px dashed #c6d5e8;background:#f3f7fe;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:26px;color:#607ca9;margin-bottom:12px}
.inspection-placeholder span{font-size:12px}
.inspection-upload{display:grid;gap:10px;margin:12px 0}
.inspection-upload label{font-size:12px}
.inspection-upload input{width:100%;max-width:100%}
.inspection-body button{margin-top:8px}
.visual-result,.credit-panel,.vision-warning{background:#eef4ff;border:1px solid #d7e6ff;border-radius:14px;padding:16px;margin:14px 0;font-size:13px;line-height:1.55}
.visual-result p{margin:10px 0}
.material-chip{display:inline-block;background:#fff;color:#2353ab;border:1px solid #cbdcf6;border-radius:20px;padding:4px 9px;margin:3px;font-size:12px}
.finding-line{padding:9px;border-left:3px solid #3e76e5;background:#fff}
.credit-panel{padding:24px;margin-top:25px}
.credit-panel .form-grid{margin:15px 0}
#creditResult{font-weight:750;line-height:1.6;color:#1749a8}
@media(max-width:850px){.inspection-grid{grid-template-columns:1fr}}

.single-upload{background:#f7faff;border:1px solid #dce7f8;border-radius:16px;padding:22px;margin:22px 0}
.single-upload h3{margin-top:0;font-size:17px}
.single-upload .form-grid{align-items:end}
.single-upload input[type=file]{min-height:47px;padding:11px;background:white;border:1px solid #ced9ea;border-radius:10px;max-width:100%}
.suggested-views{margin-top:17px;border-top:1px solid #e2eaf7;padding-top:13px}
.suggested-views>div{margin-top:6px}
.manual-observation{background:#fff;border:1px solid #d8e3f5;border-radius:12px;padding:11px;margin-top:13px}
.manual-observation summary{cursor:pointer;color:#1c4fb5;font-size:13px;font-weight:750}
.manual-observation-form{display:grid;gap:12px;padding-top:15px}
.manual-observation-form textarea{min-height:75px}
.inspection-photo{height:250px}
@media(max-width:600px){.single-upload{padding:15px}.inspection-photo{height:200px}}

.quick-hero{padding:14px 0 10px}
.quick-hero h2{font-size:clamp(25px,3.2vw,39px);margin:10px 0 8px!important;letter-spacing:-1.1px}
.quick-hero p{font-size:14px;color:#64748b;line-height:1.7;max-width:730px}
.quick-labels{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
.quick-labels span{color:#2a5cc8;background:#edf4ff;border:1px solid #d7e4fa;padding:8px 11px;border-radius:30px;font-size:12px;font-weight:700}
.quick-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.quick-drop{padding:24px;border:2px dashed #b9cff5;background:#f7faff;border-radius:18px;display:flex;align-items:center;text-align:center;gap:11px;min-height:245px;flex-direction:column;justify-content:center;cursor:pointer}
.quick-drop:hover{border-color:#2764ed;background:#eff5ff}
.quick-drop strong{font-size:17px}
.quick-drop small{color:#687b94;font-weight:400}
.quick-drop input{max-width:100%;font-size:12px;margin-top:6px}
.quick-emoji{font-size:34px}
.quick-actions{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
.quick-actions button,.quick-actions a{display:inline-flex;text-decoration:none;justify-content:center;align-items:center;min-height:47px}
.quick-actions small{max-width:420px}
.quick-verdict{margin:24px 0;background:#edf4ff;border:1px solid #cbdcfb;border-radius:17px;padding:22px}
.quick-verdict small{display:block;color:#5e7091}
.quick-verdict strong{display:block;font-size:22px;color:#1244b6;margin:8px 0}
.quick-verdict p{font-size:12px;color:#63728c}
.quick-pictures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:22px 0}
.quick-photo{border:1px solid #dce6f4;border-radius:14px;overflow:hidden}
.quick-photo img{width:100%;height:250px;object-fit:cover}
.quick-photo div{padding:12px}
.quick-photo p{color:#66758e;font-size:13px}
.quick-finding{padding:13px;border-left:3px solid #e38b4e;background:#fff9f4;margin:9px 0;border-radius:8px}
.quick-finding p{margin:8px 0;font-size:13px}
.quick-finding small{color:#7d5e4d}
.quick-quote{border:1px solid #dce4f0;border-radius:15px;background:#f9fbff;padding:20px;margin:20px 0}
.quick-quote strong{display:block;font-size:17px;color:#244eab}
.quick-quote p,.quick-limits p{font-size:13px;color:#66758a;line-height:1.6}
.quick-limits{border-top:1px solid #e0e8f4;padding:15px 0}
.quick-limits summary{font-weight:700;cursor:pointer}
#quickProgress{color:#2553ba;font-size:13px;margin-top:13px;font-weight:650}
@media(max-width:710px){.quick-form,.quick-pictures{grid-template-columns:1fr}.quick-drop{min-height:195px;padding:18px}}

/* Evaluación rápida V3: un flujo de carga y resultado legible */
#workspace:has(.quick-top),#workspace:has(.quick-result-title){padding:clamp(24px,3.2vw,46px)}
.quick-eyebrow{display:inline-flex;align-items:center;gap:9px;color:#2458cc;font-weight:800;letter-spacing:1.3px;font-size:11px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#28b888;box-shadow:0 0 0 4px #dff7ee}
.quick-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.quick-top h2,.quick-result-title h2{font-size:clamp(28px,3vw,39px);line-height:1.17;letter-spacing:-1.25px;max-width:680px;margin:16px 0 11px!important;color:#112444}
.quick-top p,.quick-result-title p{max-width:680px;color:#627590;font-size:14px;line-height:1.7;margin:0}
.quick-top-badge{flex-shrink:0;background:#eaf2ff;border:1px solid #d5e5fd;border-radius:16px;padding:16px 18px;text-align:center;min-width:118px}
.quick-top-badge span{display:block;font-weight:850;font-size:22px;color:#1950c9}.quick-top-badge small{font-size:11px;color:#6e82a3}
.quick-stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:28px 0 30px}
.quick-stepper .step{display:flex;gap:9px;align-items:center;padding:13px 14px;border:1px solid #e3eaf4;border-radius:12px;color:#8190a6;font-size:12px;font-weight:650;background:#fafbfe}
.quick-stepper .step b{font-size:12px;border:1px solid #dae3ef;border-radius:8px;display:grid;place-items:center;width:28px;height:28px;flex-shrink:0}
.quick-stepper .step.is-current{background:#eaf2ff;color:#184ebf;border-color:#c9ddff}
.quick-stepper .step.is-current b{background:#245fe0;border-color:#245fe0;color:white}
.quick-stepper .step.is-done{color:#186c50;background:#eaf8f1;border-color:#ccebdd}
.quick-main-grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(235px,1fr);gap:22px;align-items:start}
.quick-new-form{background:white;border:1px solid #e0e8f3;border-radius:18px;padding:24px;min-width:0}
.quick-section-heading{display:flex;align-items:start;gap:13px;justify-content:space-between;margin-bottom:20px}
.quick-section-heading h3{margin:0 0 7px;font-size:17px;letter-spacing:-.3px}
.quick-section-heading p{font-size:12px;color:#76879e;line-height:1.5;margin:0}
.quick-optional-tag{font-size:11px;white-space:nowrap;color:#355fa6;background:#edf4fe;border-radius:50px;padding:7px 10px;font-weight:750}
.quick-upload-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.quick-upload-card{border:2px dashed #bfd0e8;border-radius:15px;background:#f8faff;min-width:0;min-height:252px;padding:19px 14px;cursor:pointer;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;transition:border-color .15s,background .15s}
.quick-upload-card:hover,.quick-upload-card:focus-within{border-color:#3975eb;background:#edf4ff}
.quick-upload-card.has-photo{background:#f4f9ff;border-color:#5b95ed}
.quick-upload-card input{width:100%;font-size:11px;color:#5d708c;max-width:100%;border:0;padding:0;background:transparent;margin-top:5px}
.quick-upload-card input::file-selector-button{background:#e8f0fd;color:#2255bd;border:1px solid #cce0fa;border-radius:7px;padding:7px;margin-right:5px;cursor:pointer;font-size:11px}
.quick-upload-card .upload-symbol{font-size:29px;display:grid;place-items:center;width:51px;height:51px;background:#e8f1ff;color:#285de0;border-radius:15px;font-weight:400}
.quick-upload-card .upload-title{font-size:14px;color:#1e3150}
.quick-upload-card .upload-title em{display:block;color:#1d65ce;font-weight:700;font-style:normal;font-size:10px;margin-top:4px}
.quick-upload-card .upload-title em.tag-optional{color:#8592a7}
.quick-upload-card .upload-help{font-size:12px;font-weight:400;color:#7487a1}
.quick-upload-card .upload-preview{width:100%;height:134px;object-fit:cover;border-radius:10px}
.quick-upload-card .upload-preview[hidden]{display:none}
.quick-upload-card .upload-file-name{font-size:11px;color:#2854a6;font-weight:750;overflow-wrap:anywhere}
.upload-security{font-size:11px;color:#8290a3;line-height:1.5;margin:14px 0 0}
.quick-submit-area{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:21px}
.quick-action-btn{min-height:49px;display:inline-flex;gap:9px;align-items:center;justify-content:center;text-decoration:none;font-size:13px}
.quick-action-btn:disabled{opacity:.65;cursor:progress}
.quick-action-caption{font-size:11px;color:#7789a0;max-width:210px;line-height:1.6}
.quick-aside{display:grid;gap:14px}
.side-explainer{border:1px solid #e0e9f5;border-radius:17px;padding:23px;background:#f8fbff}
.quick-small-label{letter-spacing:1.35px;font-size:10px;font-weight:850;color:#5376b3}
.side-feature{display:flex;gap:12px;margin-top:23px;align-items:flex-start}
.side-feature b{font-size:13px;color:#213550}.side-feature p{font-size:12px;color:#71829a;margin:5px 0 0;line-height:1.5}
.feature-icon{width:37px;height:37px;background:#e6efff;color:#2559c6;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:20px}
.quick-scope{background:#fff9ee;border:1px solid #f6e4bf;border-radius:15px;padding:18px;color:#725521}
.quick-scope b{font-size:12px}.quick-scope p{font-size:12px;line-height:1.6;margin:8px 0 0}
.quick-progress{display:flex;align-items:center;gap:12px;background:#eef5ff;border:1px solid #cddfff;color:#1e56b0;border-radius:11px;padding:14px;margin-top:16px;font-size:12px;line-height:1.6}
.quick-progress[hidden]{display:none}.quick-progress.is-error{background:#fff1f1;border-color:#f3cece;color:#a13939}
.progress-spinner{display:block;width:20px;height:20px;flex-shrink:0;border:3px solid #bdd4fb;border-top-color:#1d62de;border-radius:50%;animation:quickspin .8s linear infinite}
@keyframes quickspin{to{transform:rotate(360deg)}}
.quick-result-title{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.quick-report-tag{border-radius:99px;background:#fff4e7;border:1px solid #f4dec0;color:#9b6925;padding:9px 13px;font-size:11px;font-weight:700}
.result-status-card{background:linear-gradient(120deg,#edf4ff,#f8fbff);border:1px solid #d1e1fb;border-radius:18px;padding:26px;display:flex;justify-content:space-between;gap:15px;align-items:center}
.result-status-card strong{display:block;margin:9px 0;font-size:21px;color:#1949ad;line-height:1.4}
.result-status-card p{margin:0;color:#6b7c94;font-size:12px}
.result-status-icon{color:#2864d1;font-size:42px;background:white;width:62px;height:62px;border-radius:16px;display:grid;place-items:center}
.result-section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 15px}
.result-section-head h3{margin:0;font-size:17px}.result-section-head span{font-size:11px;color:#7890aa}
.result-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

/* Visual refresh / responsive UX — upload controls are accessible but not duplicated. */
:root{--blue:#275ce6;--ink:#13243e;--muted:#697c98;--line:#e3eaf4}
body{background:linear-gradient(125deg,#f4f7fc 0%,#edf4ff 56%,#f8fafc 100%)}
.shell{max-width:1610px}
.top{background:transparent;padding-bottom:22px}
.top .brand .heading{font-size:24px}
#workspace:has(.quick-top){background:#fff;border:1px solid #e0e9f6;border-radius:24px;box-shadow:0 20px 55px rgba(20,49,91,.07);padding:26px}
.quick-top{position:relative;align-items:center;min-height:190px;overflow:hidden;border-radius:21px;padding:30px 34px;background:linear-gradient(111deg,#10284d 0%,#1944a1 62%,#2969df 100%);color:white}
.quick-top:after{content:"";position:absolute;right:-50px;top:-90px;width:340px;height:340px;border-radius:50%;border:42px solid rgba(255,255,255,.07);pointer-events:none}
.quick-top>div{position:relative;z-index:1}
.quick-top h2{color:#fff!important;font-weight:800;font-size:clamp(27px,2.7vw,39px);letter-spacing:-1.3px;max-width:720px;margin:14px 0 11px!important}
.quick-top p{color:#d7e5ff;font-size:13px;line-height:1.75;max-width:640px}
.quick-top .quick-eyebrow{color:#bad4ff;letter-spacing:1.6px}
.quick-top .live-dot{background:#56e0a3;box-shadow:0 0 0 4px rgba(83,225,170,.15)}
.quick-top-badge{min-width:145px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(5px);border-radius:18px;padding:20px 18px}
.quick-top-badge span{color:white;font-size:31px}
.quick-top-badge small{color:#e0ebff;font-size:12px}
.quick-stepper{margin:21px 0 24px}
.quick-stepper .step{border-radius:14px;background:#f7f9fd;border-color:#e4eaf3;padding:14px;font-size:12px;color:#8190a5}
.quick-stepper .step.is-current{background:#edf3ff;border-color:#cddfff;color:#184db3}
.quick-stepper .step.is-current b{background:#275de5}
.quick-main-grid{grid-template-columns:minmax(0,1.8fr) minmax(250px,.83fr);gap:20px}
.quick-new-form{border-radius:20px;background:#fff;padding:26px;border:1px solid #e2eaf5;box-shadow:0 12px 30px rgba(25,54,96,.04)}
.quick-section-heading h3{font-size:19px;letter-spacing:-.4px;color:#162b4b}
.quick-section-heading p{font-size:13px}
.quick-upload-grid{gap:14px}
.quick-upload-card{position:relative;padding:24px 14px;min-height:245px;border:1.5px dashed #b6cbee;border-radius:16px;background:#f7faff;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s;overflow:hidden}
.quick-upload-card:hover{background:#edf5ff;border-color:#457ae8;box-shadow:0 9px 22px #2858b217;transform:translateY(-1px)}
.quick-upload-card:focus-within{outline:3px solid #a4befd;outline-offset:3px}
.quick-upload-card input[type=file]{position:absolute!important;opacity:0!important;width:1px!important;height:1px!important;top:0;left:0;overflow:hidden;pointer-events:none;padding:0!important;margin:0!important;border:0!important}
.quick-upload-card .upload-symbol{width:58px;height:58px;font-size:31px;background:#e4eeff;border:1px solid #d7e5ff;border-radius:17px;color:#2863d7}
.quick-upload-card .upload-title{font-size:16px;color:#172d50;font-weight:800}

.quick-upload-card .upload-file-name{display:inline-block;max-width:100%;font-size:12px;padding:9px 12px;background:#fff;border:1px solid #d1def2;border-radius:10px;color:#1b4eb2;font-weight:800;margin-top:3px}
.quick-upload-card.has-photo{border-style:solid;border-color:#6c9df3;background:#f5f9ff;justify-content:flex-start}
.quick-upload-card.has-photo .upload-symbol{display:none}
.quick-upload-card .upload-preview{height:160px;border:1px solid #e0e9f6;box-shadow:0 4px 15px #0a224b16}
.quick-upload-card.has-photo .upload-preview{order:-1}
.quick-upload-card.has-photo .upload-help{display:none}
.upload-security{margin-top:17px;line-height:1.6}
.quick-submit-area{border-top:1px solid #edf1f7;padding-top:21px;align-items:center}
.quick-action-btn{min-height:52px!important;padding:13px 21px!important;font-size:13px!important;background:linear-gradient(110deg,#285ee4,#1d4fc6);border-radius:12px!important;box-shadow:0 10px 22px #2256ce26}

.quick-scope b{font-size:13px}
.quick-scope p{font-size:12px}
.side>.card{border-radius:21px!important}

.side #newCase:hover{background:#2a446a}
.side #quickStart{background:linear-gradient(110deg,#477dff,#2b68ef)}
#notice{max-width:900px}
#workspace:has(.quick-result-title) .result-status-card{border-radius:18px}
@media(min-width:1250px){.layout{grid-template-columns:278px minmax(0,1fr);gap:21px}.quick-top h2{font-size:34px}}
@media(max-width:1110px){.quick-main-grid{grid-template-columns:1fr}.quick-aside{grid-template-columns:1fr 1fr}.quick-top{padding:25px}}
@media(max-width:800px){#workspace:has(.quick-top){padding:16px}.quick-top{padding:25px 20px;min-height:160px}.quick-top-badge{display:none}.quick-aside{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.quick-upload-grid,.quick-aside{grid-template-columns:1fr}.quick-upload-card{min-height:202px}.quick-top h2{font-size:28px}.quick-stepper .step{font-size:10px;padding:9px 6px}.quick-stepper .step b{height:23px;width:23px}.quick-new-form{padding:18px}.quick-section-heading{flex-wrap:wrap}.quick-submit-area .quick-action-btn{width:100%}.quick-action-caption{max-width:100%}}

.improvement-item strong{font-size:13px;color:#172f54}

<div id="loginPanel" class="card auth hide"><div class="brand"><span class="logo">TV</span><div><h1 class="heading">Tasación Visual</h1><p class="muted">Ingreso seguro al sistema</p></div></div>
<form id="loginForm"><div class="field"><label>Usuario</label><input id="user" autocomplete="username" required placeholder="administrador"></div><div class="field"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">Ingresar</button></form><p id="loginError" class="danger"></p></div>
<div id="mainPanel" class="shell hide"><div class="layout">
<aside class="side"><header class="top"><div class="brand"><span class="logo">TV</span><div><h1 class="heading">Tasación Visual</h1><div class="muted">Análisis de evidencias · Valoración referencial</div></div></div></header>
<div class="card side-panel"><div class="side-navigation"><button class="primary" id="quickStart" type="button">⚡ &nbsp; Evaluación rápida con IA</button><button class="secondary" id="newCase" type="button">◇ &nbsp; Expediente avanzado</button></div>
<div class="sidebar-label">BUSCAR EXPEDIENTE</div><div class="search-wrap"><span aria-hidden="true">⌕</span><input id="caseSearch" type="search" placeholder="Buscar expediente…" aria-label="Buscar expedientes"></div>
<div class="side-title sidebar-label"><span>EXPEDIENTES RECIENTES</span><span class="side-count" id="caseCount">0</span></div><div id="caseList"></div></div>
<div class="side-footer"><span class="side-avatar">TV</span><div class="side-user"><strong id="who">administrador</strong><small>Cuenta del sistema</small></div><button class="side-logout" id="logout" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">⇥</button></div></aside>
<main class="main-area"><div class="card" id="workspace"><div class="empty">Selecciona una evaluación para comenzar</div></div><div id="notice" role="status" aria-live="polite"></div></main>
</div></div>
<script>
const $=id=>document.getElementById(id);let selected=null,current=null,tab='general',userRole='',visionEnabled=false,yoloCpuEnabled=false,multiclassYoloEnabled=false,modelReadiness=null;
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
async function request(path,options={}){let r=await fetch(path,{credentials:'same-origin',...options});let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof x.detail==='string'?x.detail:'Error HTTP '+r.status);return x}
const json=(method,body)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
function note(text){$('notice').textContent=text}
function showLogin(){ $('mainPanel').classList.add('hide');$('loginPanel').classList.remove('hide')}
async function boot(){try{let me=await request('/api/me');userRole=me.role;$('who').textContent=me.username;$('loginPanel').classList.add('hide');$('mainPanel').classList.remove('hide');const health=await request('/health');visionEnabled=Boolean(health.vision_enabled);yoloCpuEnabled=Boolean(health.yolo_cpu_enabled);multiclassYoloEnabled=Boolean(health.yolo_cpu_enabled&&health.multiclass_yolo_enabled);modelReadiness=await request("/api/model-readiness").catch(()=>null);await refresh()}catch(e){showLogin()}}
$('loginForm').onsubmit=async ev=>{ev.preventDefault();try{await request('/api/login',json('POST',{username:$('user').value,password:$('pass').value}));$('pass').value='';await boot()}catch(e){$('loginError').textContent=e.message}};
$('logout').onclick=async()=>{await request('/api/logout',{method:'POST'});showLogin()};

function renderQuickStart(){
 selected=null;
 current=null;
 drawCases();
 $('workspace').innerHTML='<section class="one-hero"><div class="one-hero-copy"><h2>Evalúa una vivienda <span>con IA</span> en minutos</h2>'+
 '<p>Sube una foto exterior y, si deseas, una interior. YOLO analiza posibles fisuras, grietas, moho, manchas de filtración y desprendimiento de pintura cuando el modelo multiclase está habilitado. Recibirás un informe preliminar.</p></div>'+
 '<div class="one-hero-illustration" role="img" aria-label="Fachada de una vivienda moderna"></div></section>'+
 '<div class="one-workflow"><span class="one-stage active"><b>1</b> Subir imágenes</span><span class="one-stage"><b>2</b> Análisis con IA</span><span class="one-stage"><b>3</b> Informe listo</span></div>'+
 '<div class="one-main-grid"><section class="one-main-panel"><form id="quickForm"><div class="one-upload-grid">'+
 '<div class="one-photo-card"><div class="one-photo-heading"><span class="one-photo-icon" aria-hidden="true">⌂</span><div><h3>Vista exterior</h3><span class="one-photo-required">Obligatoria</span></div></div>'+
 '<label for="exteriorFile" class="one-drop" id="exteriorCard"><span class="one-image-icon" aria-hidden="true">▧</span><strong>Selecciona una fotografía</strong><small>Fachada, muro o acceso principal</small><span class="one-select">↑ &nbsp; Seleccionar archivo</span><img class="upload-preview" id="exteriorPreview" alt="Vista previa de la fotografía exterior" hidden><span class="upload-file-name" id="exteriorName"></span></label>'+
 '<input class="one-file-input" id="exteriorFile" type="file" name="exterior" accept="image/jpeg,image/png,image/webp" required aria-label="Adjuntar fotografía exterior"></div>'+
 '<div class="one-photo-card"><div class="one-photo-heading"><span class="one-photo-icon" aria-hidden="true">▣</span><div><h3>Vista interior</h3><span class="one-photo-required optional">Opcional</span></div></div>'+
 '<label for="interiorFile" class="one-drop" id="interiorCard"><span class="one-image-icon" aria-hidden="true">▧</span><strong>Selecciona una fotografía</strong><small>Habitación, pared o techo</small><span class="one-select">↑ &nbsp; Seleccionar archivo</span><img class="upload-preview" id="interiorPreview" alt="Vista previa de la fotografía interior" hidden><span class="upload-file-name" id="interiorName"></span></label>'+
 '<input class="one-file-input" id="interiorFile" type="file" name="interior" accept="image/jpeg,image/png,image/webp" aria-label="Adjuntar fotografía interior"></div></div>'+
 '<div class="one-bottom-action"><button class="primary quick-action-btn" type="submit" id="quickAnalyzeBtn">✦ &nbsp; Analizar vivienda y generar informe &nbsp; →</button><span>ϟ &nbsp; Sin formularios manuales</span></div>'+
 '<div class="quick-progress" id="quickProgress" role="status" aria-live="polite" hidden><span class="progress-spinner" aria-hidden="true"></span><span id="quickProgressText"></span></div></form></section>'+
 '<aside class="one-info-col"><section class="one-info-card"><h3><span class="one-info-icon">◎</span> ¿Qué recibirás?</h3>'+
 '<div class="one-feature"><span>▧</span><div><strong>Detección visual</strong><p>Posibles grietas, humedad, moho y pintura deteriorada según el modelo disponible.</p></div></div>'+
 '<div class="one-feature"><span>▤</span><div><strong>Informe inmediato</strong><p>Resultados y recomendaciones en PDF.</p></div></div>'+
 '<div class="one-feature"><span>◇</span><div><strong>Estimación responsable</strong><p>Análisis referencial, sin sustituir una tasación profesional.</p></div></div></section>'+
 '<section class="one-info-card one-status-card"><h3><span class="one-info-icon">▥</span> Estado del análisis</h3>'+
 '<div class="one-status-chips"><span class="'+(yoloCpuEnabled?"one-status-good":"")+'">'+(multiclassYoloEnabled?"YOLO 5 defectos configurado":yoloCpuEnabled?"YOLO fisuras configurado":"YOLO no disponible")+'</span><span>▧ 1–2 fotos</span></div><p class="one-model-ready">'+
 (modelReadiness?.yolo_defect5?.state==="cached_verified"?"Modelo multiclase descargado; inferencia pendiente de cada fotografía.":multiclassYoloEnabled?"Modelo multiclase configurado; se descargará y verificará al analizar la primera imagen.":yoloCpuEnabled?"Detector de fisuras configurado; los demás daños necesitan un modelo verificado.":"Sin YOLO activo.")+
 '</p></section>''+
 '<section class="one-info-card one-model-card"><h3><span class="one-info-icon">▱</span> Alcance del modelo</h3><p>YOLO multiclase reconoce cinco defectos; pisos, puertas y tarrajeo todavía requieren entrenamiento validado. La validación final corresponde a un profesional.</p></section></aside></div>';
 const form=$('quickForm');
 function updatePreview(kind){
   const input=$(kind+'File'),card=$(kind+'Card'),preview=$(kind+'Preview'),label=$(kind+'Name'),file=input.files[0];
   if(preview.dataset.url){URL.revokeObjectURL(preview.dataset.url);delete preview.dataset.url}
   if(!file){preview.hidden=true;preview.removeAttribute('src');card.classList.remove('has-photo');label.textContent='';return}
   if(!['image/jpeg','image/png','image/webp'].includes(file.type)||!file.size||file.size>8*1024*1024){
     input.value='';preview.hidden=true;card.classList.remove('has-photo');label.textContent='';note('Admite JPG, PNG o WebP de máximo 8 MB.');return
   }
   const url=URL.createObjectURL(file);preview.src=url;preview.dataset.url=url;preview.hidden=false;
   card.classList.add('has-photo');label.textContent=file.name.length>33?file.name.slice(0,30)+'…':file.name;
   note('');
 }
 ['exterior','interior'].forEach(kind=>$(kind+'File').addEventListener('change',()=>updatePreview(kind)));
 form.onsubmit=async event=>{
   event.preventDefault();
   if(!$('exteriorFile').files.length){note('Selecciona una fotografía exterior para iniciar.');return}
   const button=$('quickAnalyzeBtn'),progress=$('quickProgress'),status=$('quickProgressText');
   button.disabled=true;button.textContent='Analizando las fotografías…';progress.hidden=false;
   status.textContent='Procesando fotografías y preparando el informe. El modelo puede descargarse en la primera ejecución.';
   note('');
   try{
     const response=await fetch('/api/quick-inspection',{method:'POST',body:new FormData(form),credentials:'same-origin'});
     const body=await response.json().catch(()=>({}));
     if(!response.ok)throw Error(typeof body.detail==='string'?body.detail:'No se pudo completar el análisis (HTTP '+response.status+').');
     selected=body.case_id;renderQuickResults(body);
     window.allCases=await request('/api/cases');
     const count=$('caseCount');if(count)count.textContent=window.allCases.length+' registrados';
     drawCases();
     note(body.status==='analisis_no_disponible'?'Informe generado sin inferencia de IA disponible.':'Informe visual preliminar generado.');
   }catch(error){
     progress.classList.add('is-error');status.textContent='No se pudo completar: '+error.message;
     button.disabled=false;button.textContent='✦ Analizar vivienda y generar informe →';
   }
 };
}
function renderQuickResults(result){
 const issues=result.issues||[], materials=result.materials||[],images=result.image_summaries||[];
 const partial=result.status==='analisis_no_disponible';
 const rows=issues.map(item=>'<article class="result-issue"><span class="issue-bullet">!</span><div><div class="result-issue-heading"><strong>'+escapeHTML(item.category)+'</strong><span class="result-review-state">Por verificar</span></div>'+
 '<p><b>Vista:</b> '+escapeHTML(item.shot||'Imagen')+' · '+escapeHTML(item.description||'Observación visual preliminar')+'</p><small>Recomendación: '+escapeHTML(item.improvement||'Validar con especialista')+'</small></div></article>').join('');
 const photos=images.map(item=>'<article class="result-photo"><img loading="lazy" src="'+escapeHTML(item.annotated_url||('/api/evidence/'+item.evidence_id))+'" alt="Análisis visual de '+escapeHTML(item.shot)+'"><div><strong>'+escapeHTML(item.shot)+'</strong><p>'+escapeHTML(item.summary||'Sin observaciones')+'</p></div></article>').join('');
 $('workspace').innerHTML='<div class="quick-result-title"><div><span class="quick-eyebrow">INFORME DE INSPECCIÓN · PRELIMINAR</span><h2>Tu análisis visual está listo</h2><p>Evaluación automática basada en '+images.length+' fotografía(s). No sustituye una inspección profesional.</p></div><span class="quick-report-tag">'+(partial?'Inferencia no disponible':'Pendiente de revisión')+'</span></div>'+
 '<div class="quick-stepper" aria-label="Etapas del análisis"><div class="step is-done"><b>✓</b><span>Imágenes recibidas</span></div><div class="step is-done"><b>✓</b><span>Proceso finalizado</span></div><div class="step is-current"><b>03</b><span>Consultar informe</span></div></div>'+
 '<div class="result-status-card"><div><span class="quick-small-label">ESTADO VISUAL OBSERVADO</span><strong>'+escapeHTML(result.condition)+'</strong><p>Las conclusiones se limitan a las zonas fotografiadas.</p></div><div class="result-status-icon" aria-hidden="true">⌕</div></div>'+
 '<div class="quick-actions"><a class="primary quick-action-btn" href="/api/cases/'+encodeURIComponent(result.case_id)+'/quick-report.pdf" target="_blank" rel="noopener">↓ Descargar informe PDF</a>'+
 '<button class="secondary" id="anotherQuick">＋ Nueva evaluación</button><button class="secondary" id="viewAdvanced">Ver expediente</button></div>'+
 '<div class="result-section-head"><h3>Fotografías analizadas</h3><span>'+images.length+' vista(s)</span></div><div class="result-photo-grid">'+photos+'</div>'+
 '<div class="result-two-col"><section class="result-panel"><div class="result-section-head"><h3>Posibles hallazgos</h3><span>'+issues.length+' detectado(s)</span></div>'+
 (rows||'<p class="result-empty">No se identificaron defectos sobre los umbrales de los modelos ejecutados. Esto no demuestra que la vivienda esté en buen estado ni que no existan otros daños.</p>')+'</section>'+
 '<section class="result-panel"><div class="result-section-head"><h3>Materiales visibles</h3></div>'+
 (materials.length?materials.map(item=>'<span class="material-chip">'+escapeHTML(item.name)+'</span>').join(''):'<p class="result-empty">Materiales no verificados por el modelo actualmente disponible.</p>')+'</section></div>'+
 '<section class="result-improvements"><div class="result-section-head"><h3>Plan de mejoras recomendado</h3><span>Requiere revisión profesional</span></div>'+
 ((result.improvements||[]).length?
    '<div class="improvements-grid">'+result.improvements.map((item,i)=>'<article class="improvement-item"><span class="improvement-index">'+String(i+1).padStart(2,'0')+'</span><div><strong>'+escapeHTML(item.label||item.category)+'</strong><p><b>'+escapeHTML(item.shot)+':</b> '+escapeHTML(item.action)+'</p><small>Antes de cotizar: '+escapeHTML(item.before_quoting)+'</small></div></article>').join('')+'</div>':
    '<p class="result-empty">No hay mejoras justificadas automáticamente por los hallazgos. Se recomienda inspección de las zonas no fotografiadas.</p>')+'</section>'+
 '<details class="model-coverage"><summary>Qué puede detectar YOLO y qué requiere entrenamiento</summary><div class="model-coverage-grid">'+
 '<div><b>YOLO habilitado</b>'+(result.capabilities?.automatic||[]).map(x=>'<span class="model-capable">'+escapeHTML(x.replaceAll("_"," "))+'</span>').join('')+'</div>'+
 '<div><b>Pendiente de entrenamiento</b>'+(result.capabilities?.training_required||[]).map(x=>'<span class="model-pending">'+escapeHTML(x.replaceAll("_"," "))+'</span>').join('')+'</div></div>'+
 '<p>Las clases pendientes no se deducen por la ausencia de una caja. Las alertas de moho, filtración y pintura requieren revisión especial por su menor precisión.</p></details>'+
 '<div class="result-price-panel"><div class="result-section-head"><h3>Presupuesto y valor del inmueble</h3><span>Cálculo referencial</span></div>'+
 '<div class="result-price-grid"><div><small>Cotización de mejoras</small><strong>Por cuantificar</strong><p>Para un total en soles faltan metrados y cotizaciones verificadas. La IA no puede medir superficies reales de una foto sin escala.</p></div><div><small>Tasación monetaria</small><strong id="referenceTotal">Requiere datos de referencia</strong><p>Fotos solas no determinan valor de mercado ni de garantía. Usa valores oficiales o comparables documentados.</p></div></div>'+
 '<details class="valuation-expand"><summary>Calcular escenario monetario con datos documentados (opcional)</summary><p>Si conoces el área real y un costo por m² sustentado, el sistema calculará una referencia en S/. No es un avalúo pericial ni una cifra extraída de las fotografías.</p>'+
 '<form id="scenarioForm"><div class="scenario-fields"><label>Área construida (m²)<input type="number" name="built_area_m2" min="1" max="100000" step=".01" required placeholder="Ej. 75"></label>'+
 '<label>Valor unitario documentado (S/ por m²)<input type="number" name="construction_unit_pen_m2" min="1" max="100000" step=".01" required placeholder="Según fuente"></label>'+
 '<label>Fuente del valor (institución, categoría y fecha)<input name="source" minlength="8" maxlength="500" required placeholder="Ej. Tabla oficial 2026, partida y categoría"></label></div>'+
 '<button type="submit" class="primary">Calcular referencia documentada</button><div id="scenarioStatus" role="status"></div></form>'+
 '<p>Consulta los <a href="https://www.gob.pe/institucion/vivienda/normas-legales/7568068-015-2025-vivienda-vmvu-dgprvu" target="_blank" rel="noopener">valores unitarios oficiales de edificación vigentes en 2026</a>. Debes seleccionar la región y las partidas correctas, sin suponerlas por una imagen.</p></details>'+
 (result.quote?.items?.length?'<div class="quote-unit-list">'+result.quote.items.map(x=>'<p>'+escapeHTML(x.work)+': S/ '+Number(x.unit_price_pen).toFixed(2)+' / '+escapeHTML(x.unit)+' · Cantidad pendiente</p>').join('')+'</div>':'')+'</div>'+
 (result.analysis_errors?.length?'<div class="quick-alert"><b>Advertencia:</b> '+result.analysis_errors.map(escapeHTML).join('; ')+'</div>':'')+
 '<details class="quick-limits"><summary>Alcance y limitaciones del informe</summary>'+(result.limitations||[]).map(x=>'<p>'+escapeHTML(x)+'</p>').join('')+'</details>';
 $('anotherQuick').onclick=renderQuickStart;
 $('viewAdvanced').onclick=async()=>{tab='general';await choose(result.case_id)};
 const scenario=$('scenarioForm');
 if(scenario)scenario.onsubmit=async ev=>{
   ev.preventDefault();
   const btn=scenario.querySelector('button[type=submit]');
   btn.disabled=true;btn.textContent='Calculando...';
   const values=Object.fromEntries(new FormData(scenario));
   values.built_area_m2=Number(values.built_area_m2);
   values.construction_unit_pen_m2=Number(values.construction_unit_pen_m2);
   try{
     const calc=await request('/api/cases/'+result.case_id+'/valuation-scenario',json('POST',values));
     $('referenceTotal').textContent=money(calc.indicative_total_pen);
     $('scenarioStatus').textContent='Escenario guardado e incluido en el informe PDF. Es una referencia aritmética, no un valor comercial certificado.';
     btn.textContent='Actualizar referencia';
   }catch(error){
     $('scenarioStatus').textContent='No se pudo calcular: '+error.message;
     btn.textContent='Calcular referencia documentada';
   }finally{btn.disabled=false}
 };
}
$('quickStart').onclick=renderQuickStart;

async function refresh(){let cs=await request('/api/cases');window.allCases=cs;const counter=$('caseCount');if(counter)counter.textContent=cs.length+' registrados';drawCases();if(selected)await choose(selected,false);else renderQuickStart()}
function drawCases(){const cs=window.allCases||[];const query=($('caseSearch')?.value||'').toLocaleLowerCase().trim();const filtered=cs.filter(c=>(c.title+' '+c.asset_type+' '+c.location).toLocaleLowerCase().includes(query));$('caseList').innerHTML=filtered.map(c=>'<button class="case '+(c.id===selected?'active':'')+'" data-id="'+c.id+'"><b>'+escapeHTML(c.title)+'</b><br><small class="muted">'+escapeHTML(c.asset_type)+' · '+escapeHTML(c.status)+'</small></button>').join('')||(query?'<div class="empty-side">No hay coincidencias.</div>':'<div class="empty-side"><span class="side-icon">▤</span>Sin expedientes todavía.<br>Crea el primero para comenzar.</div>');document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>choose(el.dataset.id))}
$('caseSearch').addEventListener('input',drawCases);
$('newCase').onclick=()=>{$('workspace').innerHTML="<div class=\"form-intro\"><div><span class=\"form-eyebrow\">Gestión de activos / Registro inicial</span><h2>Nuevo expediente</h2><p>Registra los datos principales del bien para empezar la evaluación visual y documentar sus evidencias.</p></div><span class=\"workspace-tag\">Paso 1 de 3</span></div><div class=\"form-steps\"><span>① Datos del activo</span><span>② Evidencias y hallazgos</span><span>③ Valoración e informe</span></div><form id=\"caseForm\"><section class=\"form-section\"><div class=\"section-head\"><span class=\"section-index\">01</span><h3>Información del activo</h3></div><div class=\"form-grid\"><div class=\"field\"><label for=\"asset_type\">Tipo de activo <span class=\"req\">*</span></label><select id=\"asset_type\" name=\"asset_type\" required><option value=\"vivienda\">🏠 Vivienda</option><option value=\"mototaxi\">🛺 Mototaxi</option><option value=\"vehiculo\">🚙 Vehículo</option><option value=\"maquinaria\">⚙️ Maquinaria</option><option value=\"terreno\">🌿 Terreno</option></select><small>Selecciona el tipo de bien a evaluar.</small></div><div class=\"field\"><label for=\"title\">Nombre del expediente <span class=\"req\">*</span></label><input id=\"title\" name=\"title\" minlength=\"2\" maxlength=\"140\" required placeholder=\"Ej. Casa familiar - Huánuco\"><small>Un nombre corto para identificar la inspección.</small></div></div></section><section class=\"form-section\"><div class=\"section-head\"><span class=\"section-index\">02</span><h3>Información complementaria</h3></div><div class=\"form-grid\"><div class=\"field\"><label for=\"owner_name\">Propietario o responsable</label><input id=\"owner_name\" name=\"owner_name\" maxlength=\"140\" autocomplete=\"off\" placeholder=\"Nombre del responsable\"></div><div class=\"field\"><label for=\"location\">Ubicación del bien</label><input id=\"location\" name=\"location\" maxlength=\"240\" placeholder=\"Distrito, provincia, departamento\"></div><div class=\"field field-wide\"><label for=\"details\">Observaciones iniciales</label><textarea id=\"details\" name=\"details\" maxlength=\"2000\" placeholder=\"Describe el estado general, el objetivo de la tasación o información relevante…\"></textarea><small>Podrás añadir fotografías y detallar los hallazgos después de crear el expediente.</small></div></div></section><div class=\"form-actions\"><p>Los campos con * son obligatorios. Esta valoración es referencial y requiere revisión humana.</p><div class=\"flex\"><button type=\"reset\" class=\"secondary\">Limpiar</button><button class=\"primary\" type=\"submit\">Crear expediente →</button></div></div></form>";document.querySelectorAll('.case').forEach(el=>el.classList.remove('active'));$('caseForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Creando expediente…';try{let data=Object.fromEntries(new FormData(e.target));let c=await request('/api/cases',json('POST',data));selected=c.id;tab='inspeccion';await refresh();note('Expediente creado. Captura las fotografías guiadas para la inspección visual.')}catch(ex){note(ex.message);btn.disabled=false;btn.textContent='Crear expediente →'}}};
async function choose(id,draw=true){selected=id;current=await request('/api/cases/'+id);document.querySelectorAll('.case').forEach(el=>el.classList.toggle('active',el.dataset.id===id));render()}
function render(){let c=current;if(!c)return;let tabs=['general','inspeccion','evidencias','hallazgos','valoracion','informes'];$('workspace').innerHTML='<div class="flex" style="justify-content:space-between"><div><h2>'+escapeHTML(c.title)+'</h2><p class="muted">'+escapeHTML(c.asset_type)+' · '+escapeHTML(c.location)+'</p></div><span class="pill">'+escapeHTML(c.status)+'</span></div><div class="grid"><div class="metric"><small>Valor base documentado</small><strong>'+money(c.base_value)+'</strong></div><div class="metric"><small>Estimación referencial</small><strong>'+money(c.estimated_value)+'</strong><small>'+escapeHTML(c.valuation_status)+'</small></div></div><nav class="tabs">'+tabs.map(t=>'<button data-tab="'+t+'" class="'+(t===tab?'active':'')+'">'+({general:'Resumen',inspeccion:'Inspección visual IA',evidencias:'Evidencias',hallazgos:'Hallazgos',valoracion:'Valoración',informes:'Informes'}[t])+'</button>').join('')+'</nav><div id="tabContent"></div>';document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render()});const h=$('tabContent');if(tab==='general')h.innerHTML='<h3>Información del expediente</h3><p><b>Propietario:</b> '+escapeHTML(c.owner_name||'No registrado')+'</p><p><b>Observaciones:</b> '+escapeHTML(c.details||'Sin observaciones')+'</p><p><b>Hallazgos pendientes:</b> '+c.unreviewed+'</p><p class="muted">La inspección y los importes requieren validación humana. Ninguna detección automática aprueba créditos.</p>';
if(tab==='evidencias'){h.innerHTML='<h3>Capturar evidencia</h3><form id="uploadForm"><div class="grid"><div class="field"><label>Toma</label><select name="shot"><option>Frente</option><option>Interior</option><option>Detalles</option><option>General</option><option>Posterior</option></select></div><div class="field"><label>Fotografía (máx. 8 MB)</label><input name="file" type="file" accept="image/jpeg,image/png,image/webp" required></div></div><button class="primary">Subir fotografía</button></form><div class="flex" style="margin-top:20px">'+c.evidence.map(x=>'<div class="evidence"><img alt="Evidencia" src="/api/evidence/'+x.id+'"><small>'+escapeHTML(x.original_name)+'<br>'+escapeHTML(x.shot)+'</small><button class="secondary" data-analyze="'+x.id+'" style="width:100%">Analizar YOLO</button></div>').join('')+'</div>';$('uploadForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let r=await fetch('/api/cases/'+c.id+'/evidence',{method:'POST',body:f});if(!r.ok)throw Error((await r.json()).detail);await choose(c.id);note('Fotografía registrada')}catch(ex){note(ex.message)}};document.querySelectorAll('[data-analyze]').forEach(el=>el.onclick=async()=>{try{let r=await request((yoloCpuEnabled&&c.asset_type==='vivienda'?'/api/cases/'+c.id+'/automatic-inspection/':'/api/cases/'+c.id+'/analyze/')+el.dataset.analyze,{method:'POST'});tab='inspeccion';await choose(c.id);note(yoloCpuEnabled&&c.asset_type==='vivienda'?'Resultados YOLO pendientes de revisión':'Detecciones pendientes de revisión')}catch(ex){note(ex.message)}})}

if(tab==='inspeccion'){
 const ins=c.visual_condition||{},shots=ins.required_shots||['Fachada','Paredes','Techo','Interior'];
 const items=c.visual_assessments||[],evidence=c.evidence||[];
 const status=yoloCpuEnabled&&c.asset_type==='vivienda'?'<span class="pill">YOLO activo · detección de fisuras</span>':visionEnabled?'<span class="pill">Visión multimodal disponible</span>':'<span class="pill">Inspección manual disponible</span>';
 const conditionLabels={aparentemente_bueno:'Aparentemente conservado',requiere_mejoras:'Mejoras visibles',no_determinable:'No determinable'};
 const photos=evidence.map((image,i)=>{
   const assessment=items.find(a=>a.evidence_id===image.id);
   let observations='';
   if(assessment){
     let v={};try{v=JSON.parse(assessment.result_json)}catch(err){}
     observations='<div class="visual-result"><div class="flex"><strong>'+escapeHTML(conditionLabels[v.condition]||'Sin conclusión')+'</strong><span class="pill">'+escapeHTML(assessment.state)+'</span></div>'+
       '<small class="muted">'+(v.method==='manual_review'?'Observación del revisor':v.method==='yolo_cpu_onnx'?'YOLO ONNX · detección automática de posibles fisuras':'Propuesta de IA pendiente de revisión')+'</small>'+
       '<p>'+escapeHTML(v.summary||'Sin resumen')+'</p>'+
       (v.annotated_url?'<img class="inspection-photo" src="'+escapeHTML(v.annotated_url)+'" alt="Fotografía con posibles fisuras señaladas">':'')+
       (v.materials||[]).map(x=>'<span class="material-chip">'+escapeHTML(x.name)+'</span>').join('')+
       (v.issues||[]).map(x=>'<p class="finding-line"><b>'+escapeHTML(x.category)+'</b> · '+escapeHTML(x.severity)+' — '+escapeHTML(x.description)+'<br><small>Mejora: '+escapeHTML(x.improvement)+'</small></p>').join('')+
       (v.limitations||[]).map(x=>'<p class="muted">Límite: '+escapeHTML(x)+'</p>').join('')+
       ((userRole!=='operador'&&assessment.state==='pendiente')?'<div class="flex"><button class="secondary" data-review-vision="'+assessment.id+'" data-decision="confirmado">Confirmar observaciones</button><button class="secondary" data-review-vision="'+assessment.id+'" data-decision="descartado">Descartar</button></div>':'')+'</div>';
   }
   const manualForm=userRole==='operador'?'':'<details class="manual-observation"><summary>Registrar inspección visual manual</summary>'+
   '<form class="manual-observation-form" data-evidence="'+image.id+'"><div class="field"><label>Condición visual observada</label><select name="condition"><option value="no_determinable">No determinable</option><option value="aparentemente_bueno">Aparentemente conservada</option><option value="requiere_mejoras">Requiere mejoras visibles</option></select></div>'+
   '<div class="field"><label>Material observado (opcional)</label><input name="material" maxlength="100" placeholder="Ej. ladrillo, calamina, concreto"></div>'+
   '<div class="field"><label>Problema visible (opcional)</label><select name="category"><option value="">Ninguno identificado en esta foto</option><option value="Fisura visible">Fisura visible</option><option value="Pared sin tarrajear">Pared sin tarrajear</option><option value="Humedad visible">Humedad visible</option><option value="Corrosión superficial">Corrosión superficial</option><option value="Desgaste visible">Desgaste visible</option><option value="Abolladura visible">Abolladura visible</option><option value="Otro daño visible">Otro daño visible</option></select></div>'+
   '<div class="field"><label>Severidad visual preliminar</label><select name="severity"><option value="leve">Leve</option><option value="moderada">Moderada</option><option value="severa">Severa</option></select></div>'+
   '<div class="field"><label>Descripción (opcional)</label><textarea name="description" maxlength="500" placeholder="Describe lo que puedes comprobar visualmente"></textarea></div>'+
   '<div class="field"><label>Mejora recomendada (opcional)</label><input name="improvement" maxlength="300" placeholder="Ej. solicitar presupuesto de reparación"></div>'+
   '<div class="field"><label>Observaciones del revisor</label><textarea name="notes" maxlength="350" placeholder="Qué se ve y qué no puede comprobarse"></textarea></div>'+
   '<button class="primary" type="submit">Guardar evaluación manual</button></form></details>';
   return '<article class="inspection-card"><div class="inspection-number">'+String(i+1).padStart(2,'0')+'</div>'+
   '<div class="inspection-body"><div class="flex" style="justify-content:space-between"><h3>'+escapeHTML(image.shot)+'</h3><span class="pill">Foto '+(i+1)+'</span></div>'+
   '<img class="inspection-photo" src="/api/evidence/'+image.id+'" alt="Fotografía adjunta de '+escapeHTML(image.shot)+'">'+
   ((yoloCpuEnabled&&c.asset_type==='vivienda')?'<button class="primary" data-yolo-cpu="'+image.id+'">Detectar fisuras con YOLO</button>':visionEnabled?'<button class="primary" data-vision="'+image.id+'">Analizar fotografía con IA multimodal</button>':'')+
   manualForm+observations+'</div></article>';
 }).join('');
 const optional=shots.map(x=>'<span class="material-chip">'+escapeHTML(x)+'</span>').join('');
 h.innerHTML='<div class="form-intro"><div><span class="form-eyebrow">Microcrédito / Inspección fotográfica</span><h2>Evaluación visual del activo</h2><p>Comienza con una sola fotografía. Las demás vistas son recomendadas para ampliar la inspección, no son obligatorias para registrar observaciones.</p></div>'+status+'</div>'+
 '<div class="grid" style="margin:24px 0"><div class="metric"><small>Fotografías registradas</small><strong>'+evidence.length+'</strong><small>'+ins.coverage+'% de vistas sugeridas</small></div><div class="metric"><small>Puntaje visual</small><strong>'+(ins.condition_score===null?'Por evaluar':ins.condition_score+'/100')+'</strong><small>'+(ins.score_status==='provisional_parcial'?'Provisional — cobertura parcial':ins.score_status==='referencial_revisado'?'Referencial revisado':'Falta revisión')+'</small></div></div>'+
 ((yoloCpuEnabled&&c.asset_type==='vivienda')?'<div class="vision-warning"><b>Detección YOLO de fisuras disponible.</b> Adjunta la foto y pulsa «Detectar fisuras con YOLO». El sistema señalará posibles fisuras, pero este modelo <b>no determina si toda la vivienda está bien</b> ni identifica automáticamente calamina, concreto o paredes sin tarrajear. Los resultados requieren revisión.</div>':visionEnabled?'<div class="vision-warning">La fotografía será procesada por el proveedor multimodal configurado. Utiliza solo imágenes que tengas autorización para enviar.</div>':'<div class="vision-warning"><b>Modelo automático no disponible.</b> Puedes registrar observaciones manuales claramente identificadas mientras se configura un detector válido.</div>')+
 '<section class="single-upload"><h3>Adjuntar fotografía para evaluar</h3><p class="muted">Una foto es suficiente para comenzar. Elige la vista que representa; puedes agregar otras después.</p><form id="singleInspectionUpload" class="form-grid"><div class="field"><label>Vista de la fotografía</label><select name="shot">'+shots.map(x=>'<option value="'+escapeHTML(x)+'">'+escapeHTML(x)+'</option>').join('')+'<option value="General">Otra vista / General</option></select></div><div class="field"><label>Imagen (JPG, PNG o WebP, máximo 8 MB)</label><input name="file" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required></div><div class="field field-wide"><button type="submit" class="primary">Guardar fotografía</button></div></form><div class="suggested-views"><small class="muted">Vistas recomendadas para una evaluación más completa:</small><div>'+optional+'</div></div></section>'+
 '<h3 style="margin-top:27px">Fotografías del expediente</h3>'+
 (photos?'<div class="inspection-grid">'+photos+'</div>':'<div class="inspection-placeholder">📷<span>Adjunta una fotografía para iniciar la evaluación</span></div>')+
 '<div class="credit-panel"><h3>Simulación de microcrédito para mejoras</h3><p class="muted">Puede mostrarse una evaluación visual provisional desde una sola foto revisada. Para simular un crédito se requieren las cuatro vistas recomendadas, valor base y presupuesto sustentados; nunca es aprobación bancaria.</p>'+
 (userRole==='operador'?'<p class="muted">La simulación corresponde al revisor.</p>':'<form id="creditForm" class="form-grid"><div class="field"><label>Presupuesto documentado (S/)</label><input name="documented_budget" type="number" min="1" step=".01" required></div><div class="field"><label>Fuente del presupuesto</label><input name="budget_source" minlength="5" required></div><div class="field field-wide"><button class="primary" type="submit">Simular monto referencial</button></div></form><div id="creditResult" role="status"></div>')+'</div>';
 const upload=$('singleInspectionUpload');
 upload.onsubmit=async ev=>{
   ev.preventDefault();const btn=upload.querySelector('button');btn.disabled=true;btn.textContent='Subiendo...';
   try{const r=await fetch('/api/cases/'+c.id+'/evidence',{method:'POST',body:new FormData(upload),credentials:'same-origin'});
       const data=await r.json();if(!r.ok)throw Error(data.detail||'No se pudo subir la imagen');
       await choose(c.id);note('Fotografía guardada. Puedes evaluarla sin subir las otras tres vistas.');
   }catch(ex){note(ex.message);btn.disabled=false;btn.textContent='Guardar fotografía'}
 };
 document.querySelectorAll('[data-yolo-cpu]').forEach(btn=>btn.onclick=async()=>{
   btn.disabled=true;btn.textContent='YOLO examinando la imagen...';
   try{
      const result=await request('/api/cases/'+c.id+'/automatic-inspection/'+btn.dataset.yoloCpu,{method:'POST'});
      await choose(c.id);
      note(result.result.issues.length+' posible(s) fisura(s) detectada(s) por YOLO, pendientes de revisión.');
   }catch(ex){note(ex.message);btn.disabled=false;btn.textContent='Detectar fisuras con YOLO'}
 });
 document.querySelectorAll('[data-vision]').forEach(btn=>btn.onclick=async()=>{
   btn.disabled=true;btn.textContent='Analizando...';
   try{await request('/api/cases/'+c.id+'/vision/'+btn.dataset.vision,{method:'POST'});
       await choose(c.id);note('Propuesta automática recibida, pendiente de revisión');
   }catch(ex){note(ex.message);btn.disabled=false;btn.textContent='Analizar fotografía con IA'}
 });
 document.querySelectorAll('.manual-observation-form').forEach(form=>form.onsubmit=async ev=>{
   ev.preventDefault();const btn=form.querySelector('button');btn.disabled=true;
   try{const data=Object.fromEntries(new FormData(form));
     await request('/api/cases/'+c.id+'/manual-inspection/'+form.dataset.evidence,json('POST',data));
     await choose(c.id);note('Observación manual guardada. Puntaje provisional actualizado si la condición fue determinable.');
   }catch(ex){note(ex.message);btn.disabled=false}
 });
 document.querySelectorAll('[data-review-vision]').forEach(btn=>btn.onclick=async()=>{
   btn.disabled=true;
   try{await request('/api/visual-assessments/'+btn.dataset.reviewVision+'/review',json('PUT',{state:btn.dataset.decision}));
       await choose(c.id);note('Revisión registrada');
   }catch(ex){note(ex.message);btn.disabled=false}
 });
 const credit=$('creditForm');if(credit)credit.onsubmit=async ev=>{
   ev.preventDefault();const data=Object.fromEntries(new FormData(credit));data.documented_budget=Number(data.documented_budget);
   try{const r=await request('/api/cases/'+c.id+'/credit-simulation',json('POST',data));
     $('creditResult').textContent=r.suggested_amount===null?'Pendiente: '+r.reason:'Monto orientativo: '+money(r.suggested_amount)+'. '+r.reason;
   }catch(ex){note(ex.message)}
 };
}

if(tab==='hallazgos'){h.innerHTML='<h3>Hallazgos y revisión</h3><form id="findingForm"><div class="grid"><div class="field"><label>Daño o material observado</label><input name="category" required placeholder="Ej. fisura visible"></div><div class="field"><label>Severidad preliminar</label><select name="severity"><option value="leve">Leve</option><option value="moderada">Moderada</option><option value="severa">Severa</option></select></div></div><div class="field"><label>Descripción</label><textarea name="description"></textarea></div><button class="primary">Añadir hallazgo manual</button></form><div id="findingList">'+c.findings.map(x=>'<div class="finding"><div class="flex"><b>'+escapeHTML(x.category)+'</b><span class="pill">'+escapeHTML(x.state)+'</span><small class="muted">'+escapeHTML(x.origin)+' · '+escapeHTML(x.severity)+'</small></div><p>'+escapeHTML(x.description)+'</p>'+(userRole==='operador'?'<p class="muted">Revisión reservada al revisor</p>':'<form class="reviewForm" data-fid="'+x.id+'"><div class="grid"><div class="field"><label>Decisión</label><select name="state"><option value="pendiente" '+(x.state==='pendiente'?'selected':'')+'>Pendiente</option><option value="confirmado" '+(x.state==='confirmado'?'selected':'')+'>Confirmado</option><option value="descartado" '+(x.state==='descartado'?'selected':'')+'>Descartado</option></select></div><div class="field"><label>Descuento sustentado (S/)</label><input name="adjustment" type="number" min="0" step="0.01" value="'+x.adjustment+'"></div></div><div class="field"><label>Justificación</label><input name="justification" value="'+escapeHTML(x.justification)+'"></div><button class="secondary">Guardar revisión</button></form>')+'</div>').join('')+'</div>';$('findingForm').onsubmit=async e=>{e.preventDefault();try{await request('/api/cases/'+c.id+'/findings',json('POST',Object.fromEntries(new FormData(e.target))));await choose(c.id);note('Hallazgo añadido')}catch(ex){note(ex.message)}};document.querySelectorAll('.reviewForm').forEach(el=>el.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(el));d.adjustment=Number(d.adjustment);try{await request('/api/findings/'+el.dataset.fid+'/review',json('PUT',d));await choose(c.id);note('Revisión guardada')}catch(ex){note(ex.message)}})}
if(tab==='valoracion'){h.innerHTML='<h3>Valoración documentada</h3><p class="muted">Solo el revisor puede establecer el valor base y confirmar los descuentos. Los importes son referenciales.</p><form id="baseForm"><div class="field"><label>Valor base en soles</label><input name="base_value" type="number" min="0" step="0.01" value="'+c.base_value+'" required></div><div class="field"><label>Fuente de mercado, comparable o presupuesto</label><textarea name="source" required>'+escapeHTML(c.source)+'</textarea></div><button class="primary" '+(userRole==='operador'?'disabled':'')+'>Guardar valor base</button></form>';$('baseForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.base_value=Number(d.base_value);try{await request('/api/cases/'+c.id+'/base',json('PUT',d));await choose(c.id);note('Valor base actualizado')}catch(ex){note(ex.message)}}}
if(tab==='informes'){h.innerHTML='<h3>Exportación y trazabilidad</h3><p>Estado: <b>'+escapeHTML(c.valuation_status)+'</b> · '+c.unreviewed+' hallazgos sin revisar.</p><div class="flex"><a class="primary" href="/api/cases/'+c.id+'/report.pdf">Descargar PDF</a><a class="secondary" href="/api/cases/'+c.id+'/report.json">Descargar JSON</a></div><p class="muted">El informe es orientativo y no sustituye una tasación profesional.</p>'}}
boot();
</script></body></html>
